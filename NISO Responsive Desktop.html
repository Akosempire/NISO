<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NISO — Responsive Dashboard</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
    
    .app { display: flex; min-height: 100vh; }
    
    /* SIDEBAR */
    .sidebar { 
      width: 260px; 
      background: #f9f9f9; 
      border-right: 1px solid #e0e0e0; 
      padding: 24px 0; 
      overflow-y: auto;
      transition: transform 0.3s;
    }
    .sidebar-logo { padding: 0 20px 24px; font-size: 18px; font-weight: 700; color: #2563eb; border-bottom: 1px solid #e0e0e0; margin-bottom: 20px; }
    .nav-section { padding: 0 12px; margin-bottom: 16px; }
    .nav-section-title { padding: 0 8px 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #999; }
    .nav-item { padding: 10px 12px; border-radius: 3px; font-size: 13px; cursor: pointer; transition: all 0.2s; color: #666; }
    .nav-item:hover { background: #f0f0f0; }
    .nav-item.active { background: #e3f2fd; color: #2563eb; font-weight: 600; }
    
    /* HEADER */
    .header { 
      background: white; 
      border-bottom: 1px solid #e0e0e0; 
      padding: 16px 24px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      height: 70px;
    }
    .header-title { font-size: 18px; font-weight: 600; }
    .header-right { display: flex; gap: 16px; align-items: center; }
    .user-info { text-align: right; font-size: 12px; }
    .user-name { font-weight: 600; }
    .user-role { color: #999; font-size: 11px; }
    .sync-badge { 
      font-size: 11px; 
      padding: 4px 8px; 
      border-radius: 2px; 
      background: #e6f9f0; 
      color: #047857;
    }
    
    /* MAIN */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .content { flex: 1; overflow-y: auto; padding: 24px; }
    
    /* CARDS & GRIDS */
    .card { background: white; border: 1px solid #e0e0e0; border-radius: 4px; padding: 20px; margin-bottom: 20px; }
    .card-title { font-size: 14px; font-weight: 600; margin-bottom: 16px; color: #333; }
    
    .kpi-grid { display: grid; gap: 16px; margin-bottom: 24px; }
    .kpi-card { background: white; border: 1px solid #e0e0e0; border-radius: 4px; padding: 20px; border-top: 4px solid #2563eb; }
    .kpi-card.alert { border-top-color: #d32f2f; }
    .kpi-label { font-size: 12px; color: #666; margin-bottom: 8px; }
    .kpi-value { font-size: 32px; font-weight: 700; color: #2563eb; }
    .kpi-card.alert .kpi-value { color: #d32f2f; }
    
    .equipment-table { width: 100%; border-collapse: collapse; }
    .equipment-table th { padding: 12px; text-align: left; font-size: 11px; font-weight: 600; background: #f9f9f9; border-bottom: 1px solid #e0e0e0; }
    .equipment-table td { padding: 12px; border-bottom: 1px solid #f0f0f0; font-size: 12px; }
    .equipment-table tr:hover { background: #f9f9f9; }
    
    .badge { display: inline-block; padding: 4px 8px; border-radius: 3px; font-size: 10px; font-weight: 600; }
    .badge-green { background: #e6f9f0; color: #047857; }
    .badge-red { background: #fee2e2; color: #991b1b; }
    
    .btn { padding: 8px 12px; border: 1px solid #ddd; background: white; border-radius: 3px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
    .btn:hover { border-color: #2563eb; background: #f0f8ff; }
    .btn-primary { background: #2563eb; color: white; border-color: #2563eb; }
    .btn-primary:hover { background: #1e53d6; }
    
    /* MOBILE BREAKPOINTS */
    @media (max-width: 768px) {
      .app { flex-direction: column; }
      .sidebar { 
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid #e0e0e0;
        padding: 16px;
        z-index: 100;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .main { margin-top: 60px; }
      .header { height: 60px; padding: 12px 16px; }
      .header-title { font-size: 16px; }
      .content { padding: 16px; }
      .kpi-grid { grid-template-columns: 1fr; }
      .equipment-table { font-size: 11px; }
      .equipment-table th { padding: 8px; }
      .equipment-table td { padding: 8px; }
      .nav-item { padding: 8px 10px; font-size: 12px; }
    }
    
    @media (min-width: 769px) and (max-width: 1200px) {
      .sidebar { width: 200px; }
      .sidebar-logo { font-size: 14px; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .content { padding: 20px; }
    }
    
    @media (min-width: 1201px) {
      .sidebar { width: 260px; }
      .kpi-grid { grid-template-columns: repeat(4, 1fr); }
      .content { padding: 24px; }
    }
    
    /* MENU TOGGLE */
    .menu-toggle { display: none; background: none; border: none; font-size: 20px; cursor: pointer; }
    @media (max-width: 768px) {
      .menu-toggle { display: block; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail" data-bg-color="#f5f5f5">
    <svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
      <rect width="300" height="200" fill="#f5f5f5"/>
      <rect x="5" y="5" width="50" height="190" fill="#f9f9f9" stroke="#e0e0e0" stroke-width="1"/>
      <rect x="60" y="5" width="235" height="25" fill="white" stroke="#e0e0e0" stroke-width="1"/>
      <text x="150" y="20" font-size="12" font-weight="600" fill="#333" text-anchor="middle">NISO Dashboard</text>
      <rect x="60" y="35" width="235" height="160" fill="white" stroke="#e0e0e0" stroke-width="1"/>
      <circle cx="90" cy="60" r="15" fill="#2563eb" opacity="0.3"/>
      <circle cx="170" cy="60" r="15" fill="#047857" opacity="0.3"/>
      <circle cx="250" cy="60" r="15" fill="#f59e0b" opacity="0.3"/>
      <rect x="70" y="90" width="200" height="2" fill="#2563eb" opacity="0.5"/>
      <rect x="70" y="100" width="200" height="2" fill="#047857" opacity="0.5"/>
      <rect x="70" y="140" width="100" height="2" fill="#e0e0e0"/>
      <rect x="70" y="150" width="150" height="2" fill="#e0e0e0"/>
    </svg>
  </template>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function ResponsiveDashboard() {
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);
      const [activeTab, setActiveTab] = useState('dashboard');

      useEffect(() => {
        const handleResize = () => {
          setIsMobile(window.innerWidth <= 768);
          if (window.innerWidth > 768) setSidebarOpen(false);
        };
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const equipment = [
        { id: 1, name: '2SHR TR1', status: 'Operating', uptime: 99.2, sla: 98.5, alert: false },
        { id: 2, name: '2SHR TR2', status: 'Alert', uptime: 91.8, sla: 94.2, alert: true },
        { id: 3, name: '2SHR TR3', status: 'Operating', uptime: 97.5, sla: 96.8, alert: false },
        { id: 4, name: 'CONDC-A1', status: 'Operating', uptime: 98.1, sla: 97.5, alert: false },
        { id: 5, name: 'CONDC-A2', status: 'Critical', uptime: 82.3, sla: 88.5, alert: true }
      ];

      return (
        <div className="app">
          {/* SIDEBAR */}
          <div className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
            <div className="sidebar-logo">NISO</div>
            <div className="nav-section">
              <div className="nav-section-title">Navigation</div>
              <div 
                className={`nav-item ${activeTab === 'dashboard' ? 'active' : ''}`}
                onClick={() => { setActiveTab('dashboard'); setSidebarOpen(false); }}
              >
                📊 Dashboard
              </div>
              <div 
                className={`nav-item ${activeTab === 'readings' ? 'active' : ''}`}
                onClick={() => { setActiveTab('readings'); setSidebarOpen(false); }}
              >
                📝 Readings
              </div>
              <div 
                className={`nav-item ${activeTab === 'reports' ? 'active' : ''}`}
                onClick={() => { setActiveTab('reports'); setSidebarOpen(false); }}
              >
                📈 Reports
              </div>
            </div>
          </div>

          {/* MAIN */}
          <div className="main">
            <div className="header">
              <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                <button 
                  className="menu-toggle"
                  onClick={() => setSidebarOpen(!sidebarOpen)}
                >
                  ☰
                </button>
                <div className="header-title">
                  {activeTab === 'dashboard' && '📊 Dashboard'}
                  {activeTab === 'readings' && '📝 Readings'}
                  {activeTab === 'reports' && '📈 Reports'}
                </div>
              </div>
              <div className="header-right">
                <span className="sync-badge">✓ Synced</span>
                <div className="user-info">
                  <div className="user-name">Field Op</div>
                  <div className="user-role">Supervisor</div>
                </div>
              </div>
            </div>

            <div className="content">
              {activeTab === 'dashboard' && (
                <>
                  {/* KPI CARDS */}
                  <div className="kpi-grid">
                    <div className="kpi-card">
                      <div className="kpi-label">Avg SLA (Actual)</div>
                      <div className="kpi-value">95.6%</div>
                      <div style={{ fontSize: '11px', color: '#999', marginTop: '8px' }}>vs 95% target</div>
                    </div>
                    <div className="kpi-card alert">
                      <div className="kpi-label">Critical Alerts</div>
                      <div className="kpi-value">1</div>
                      <div style={{ fontSize: '11px', color: '#999', marginTop: '8px' }}>Requires attention</div>
                    </div>
                    <div className="kpi-card">
                      <div className="kpi-label">Avg Uptime</div>
                      <div className="kpi-value">94.0%</div>
                      <div style={{ fontSize: '11px', color: '#999', marginTop: '8px' }}>5 equipment</div>
                    </div>
                    <div className="kpi-card">
                      <div className="kpi-label">Readings Today</div>
                      <div className="kpi-value">24</div>
                      <div style={{ fontSize: '11px', color: '#999', marginTop: '8px' }}>All submitted</div>
                    </div>
                  </div>

                  {/* EQUIPMENT TABLE */}
                  <div className="card">
                    <div className="card-title">Equipment Status</div>
                    <table className="equipment-table">
                      <thead>
                        <tr>
                          <th>Equipment</th>
                          <th>Status</th>
                          <th>Uptime %</th>
                          <th>SLA %</th>
                          {!isMobile && <th>Action</th>}
                        </tr>
                      </thead>
                      <tbody>
                        {equipment.map(eq => (
                          <tr key={eq.id}>
                            <td style={{ fontWeight: 600 }}>{eq.name}</td>
                            <td>
                              <span className={`badge ${eq.alert ? 'badge-red' : 'badge-green'}`}>
                                {eq.status}
                              </span>
                            </td>
                            <td>{eq.uptime}%</td>
                            <td>{eq.sla}%</td>
                            {!isMobile && <td><button className="btn">View</button></td>}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </>
              )}

              {activeTab === 'readings' && (
                <div className="card" style={{ textAlign: 'center', padding: '40px 20px' }}>
                  <div style={{ fontSize: '16px', fontWeight: 600, marginBottom: '8px' }}>Readings Entry</div>
                  <div style={{ fontSize: '13px', color: '#999' }}>
                    {isMobile 
                      ? 'Swipe up on your mobile device to enter readings'
                      : 'Use the readings module to log equipment data in the field'
                    }
                  </div>
                </div>
              )}

              {activeTab === 'reports' && (
                <div className="card" style={{ textAlign: 'center', padding: '40px 20px' }}>
                  <div style={{ fontSize: '16px', fontWeight: 600, marginBottom: '8px' }}>Reports</div>
                  <div style={{ fontSize: '13px', color: '#999' }}>Historical analysis and exports</div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ResponsiveDashboard />);
  </script>
</body>
</html>
