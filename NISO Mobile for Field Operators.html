<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NISO Mobile — Field Operations</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
    
    .app { display: flex; flex-direction: column; min-height: 100vh; width: 100%; }
    
    /* HEADER */
    .header { background: white; border-bottom: 1px solid #e0e0e0; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .header-title { font-size: 16px; font-weight: 600; }
    .header-status { font-size: 10px; padding: 2px 6px; border-radius: 2px; background: #e6f9f0; color: #047857; }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px; }
    
    /* MAIN CONTENT */
    .content { flex: 1; overflow-y: auto; padding: 12px; padding-bottom: 70px; }
    
    /* BOTTOM TAB BAR */
    .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e0e0e0; display: grid; grid-template-columns: repeat(4, 1fr); height: 60px; z-index: 100; }
    .tab-btn { background: none; border: none; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; color: #999; font-size: 11px; }
    .tab-btn.active { color: #2563eb; background: #f0f8ff; border-top: 3px solid #2563eb; }
    .tab-icon { font-size: 20px; margin-bottom: 2px; }
    
    /* CARDS */
    .card { background: white; border: 1px solid #e0e0e0; border-radius: 4px; padding: 12px; margin-bottom: 12px; }
    .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px; }
    .card-title { font-size: 13px; font-weight: 600; }
    .card-badge { display: inline-block; padding: 3px 6px; border-radius: 2px; font-size: 9px; font-weight: 600; }
    .badge-alert { background: #fee2e2; color: #991b1b; }
    .badge-ok { background: #e6f9f0; color: #047857; }
    
    /* FORMS */
    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 4px; color: #666; }
    .form-input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 3px; font-size: 14px; }
    .form-input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .form-select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 3px; font-size: 14px; }
    
    /* BUTTONS */
    .btn { padding: 12px 16px; border: 1px solid #ddd; background: white; border-radius: 3px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; width: 100%; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: #2563eb; color: white; border-color: #2563eb; }
    .btn-primary:active { background: #1e53d6; }
    .btn-success { background: #047857; color: white; border-color: #047857; }
    .btn-success:active { background: #065f46; }
    .btn-secondary { background: #f0f0f0; color: #333; border-color: #ddd; }
    .btn-danger { background: #d32f2f; color: white; border-color: #d32f2f; }
    
    /* STATS */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .stat-box { background: #f9f9f9; padding: 10px; border-radius: 3px; }
    .stat-label { font-size: 10px; color: #999; margin-bottom: 2px; }
    .stat-value { font-size: 20px; font-weight: 700; color: #2563eb; }
    
    /* MODAL */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 200; display: flex; flex-direction: column; align-items: flex-end; }
    .modal { background: white; position: fixed; bottom: 0; left: 0; right: 0; max-height: 80vh; border-radius: 12px 12px 0 0; overflow-y: auto; z-index: 201; }
    .modal-header { padding: 16px; border-bottom: 1px solid #e0e0e0; position: sticky; top: 0; background: white; }
    .modal-handle { width: 40px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 12px; }
    .modal-title { font-size: 14px; font-weight: 600; }
    .modal-content { padding: 16px; }
    .modal-footer { padding: 16px; border-top: 1px solid #e0e0e0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    /* ALERTS */
    .alert { padding: 10px 12px; border-radius: 3px; margin-bottom: 12px; font-size: 12px; }
    .alert-info { background: #dbeafe; color: #1e40af; border-left: 3px solid #2563eb; }
    .alert-warning { background: #fffbeb; color: #b45309; border-left: 3px solid #f59e0b; }
    .alert-error { background: #fee2e2; color: #991b1b; border-left: 3px solid #d32f2f; }
    .alert-success { background: #e6f9f0; color: #047857; border-left: 3px solid #047857; }
    
    /* OFFLINE INDICATOR */
    .offline-banner { background: #fee2e2; color: #991b1b; padding: 8px 12px; font-size: 11px; font-weight: 600; text-align: center; }
    
    /* SYNC STATUS */
    .sync-indicator { position: fixed; top: 12px; right: 12px; font-size: 11px; padding: 4px 8px; background: #f0f0f0; border-radius: 2px; z-index: 50; }
    .sync-indicator.synced { color: #047857; background: #e6f9f0; }
    .sync-indicator.pending { color: #b45309; background: #fffbeb; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    
    /* RESPONSIVE */
    @media (min-width: 768px) {
      .app { max-width: 100%; margin: 0 auto; }
      .content { padding: 20px; padding-bottom: 80px; }
      .card { margin-bottom: 16px; }
      .btn { font-size: 14px; padding: 14px 18px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail" data-bg-color="#2563eb">
    <svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
      <rect width="200" height="280" fill="#2563eb"/>
      <rect x="10" y="10" width="180" height="30" fill="white" rx="3"/>
      <text x="100" y="28" font-size="14" font-weight="600" fill="#2563eb" text-anchor="middle">NISO</text>
      <circle cx="100" cy="90" r="20" fill="white" opacity="0.9"/>
      <text x="100" y="95" font-size="20" text-anchor="middle">📊</text>
      <rect x="20" y="130" width="160" height="20" fill="white" opacity="0.8" rx="2"/>
      <rect x="20" y="160" width="160" height="20" fill="white" opacity="0.6" rx="2"/>
      <rect x="10" y="240" width="40" height="25" fill="white" rx="2"/>
      <rect x="60" y="240" width="40" height="25" fill="white" rx="2"/>
      <rect x="110" y="240" width="40" height="25" fill="white" rx="2"/>
      <rect x="160" y="240" width="30" height="25" fill="white" rx="2"/>
    </svg>
  </template>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Offline storage
    const useOfflineStorage = () => {
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [pendingSync, setPendingSync] = useState([]);

      useEffect(() => {
        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);

        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);

        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      const saveReading = (reading) => {
        const stored = JSON.parse(localStorage.getItem('pending_readings') || '[]');
        stored.push({ ...reading, id: `temp-${Date.now()}`, timestamp: new Date().toISOString() });
        localStorage.setItem('pending_readings', JSON.stringify(stored));
        setPendingSync(stored);
      };

      const getSyncStatus = () => {
        const pending = JSON.parse(localStorage.getItem('pending_readings') || '[]');
        return { isOnline, pendingCount: pending.length };
      };

      return { isOnline, pendingSync, saveReading, getSyncStatus };
    };

    /* ===== SLA STATUS SNAPSHOT ===== */
    function SLAStatusScreen() {
      const [equipment, setEquipment] = useState([
        { id: 1, name: '2SHR TR1', status: 'operating', sla: 98.5, uptime: 99.2, alert: false },
        { id: 2, name: '2SHR TR2', status: 'alert', sla: 92.1, uptime: 88.5, alert: true },
        { id: 3, name: 'CONDC-A1', status: 'operating', sla: 97.8, uptime: 97.5, alert: false }
      ]);

      return (
        <div className="content">
          <div className="alert alert-info">Last updated: {new Date().toLocaleTimeString()}</div>
          {equipment.map(eq => (
            <div key={eq.id} className="card">
              <div className="card-header">
                <div>
                  <div className="card-title">{eq.name}</div>
                  <div style={{ fontSize: '10px', color: '#999', marginTop: '2px' }}>
                    {eq.status === 'operating' ? '✓ Operating' : '⚠️ Alert'}
                  </div>
                </div>
                <span className={`card-badge ${eq.alert ? 'badge-alert' : 'badge-ok'}`}>
                  {eq.alert ? 'ALERT' : 'OK'}
                </span>
              </div>
              <div className="stat-grid">
                <div className="stat-box">
                  <div className="stat-label">SLA</div>
                  <div className="stat-value" style={{ color: eq.alert ? '#d32f2f' : '#047857' }}>
                    {eq.sla}%
                  </div>
                </div>
                <div className="stat-box">
                  <div className="stat-label">Uptime</div>
                  <div className="stat-value" style={{ color: eq.uptime > 95 ? '#047857' : '#f59e0b' }}>
                    {eq.uptime}%
                  </div>
                </div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    /* ===== READINGS ENTRY ===== */
    function ReadingsEntryScreen() {
      const [equipment, setEquipmentList] = useState([
        { id: 1, name: '2SHR TR1' },
        { id: 2, name: '2SHR TR2' },
        { id: 3, name: 'CONDC-A1' }
      ]);
      const [selectedEquipment, setSelectedEquipment] = useState(null);
      const [formData, setFormData] = useState({
        amperage: '',
        mw: '',
        mvar: '',
        voltage: ''
      });
      const [submitted, setSubmitted] = useState(false);
      const { isOnline, saveReading, getSyncStatus } = useOfflineStorage();
      const { pendingCount } = getSyncStatus();

      const handleSubmit = () => {
        if (!selectedEquipment || !formData.amperage || !formData.mw) {
          alert('Please fill all required fields');
          return;
        }
        saveReading({ equipment: selectedEquipment, ...formData });
        setSubmitted(true);
        setTimeout(() => {
          setFormData({ amperage: '', mw: '', mvar: '', voltage: '' });
          setSelectedEquipment(null);
          setSubmitted(false);
        }, 2000);
      };

      return (
        <div className="content">
          {!selectedEquipment ? (
            <>
              <div style={{ marginBottom: '12px' }}>
                <div style={{ fontSize: '12px', fontWeight: 600, marginBottom: '8px' }}>Select Equipment</div>
                {equipment.map(eq => (
                  <button
                    key={eq.id}
                    className="card"
                    onClick={() => setSelectedEquipment(eq.id)}
                    style={{ border: '2px solid #e0e0e0', padding: '12px', marginBottom: '8px', textAlign: 'left', cursor: 'pointer', background: 'white' }}
                  >
                    <div style={{ fontSize: '13px', fontWeight: 600 }}>{eq.name}</div>
                    <div style={{ fontSize: '11px', color: '#999', marginTop: '2px' }}>Ready for input</div>
                  </button>
                ))}
              </div>
              {pendingCount > 0 && (
                <div className="alert alert-warning">
                  {pendingCount} reading{pendingCount > 1 ? 's' : ''} pending sync
                </div>
              )}
            </>
          ) : (
            <>
              <button
                className="btn btn-secondary"
                onClick={() => setSelectedEquipment(null)}
                style={{ marginBottom: '12px' }}
              >
                ← Back to Equipment
              </button>
              
              <div className="card">
                <div className="card-title">{equipment.find(e => e.id === selectedEquipment)?.name}</div>
                <div style={{ fontSize: '11px', color: '#999', marginTop: '2px' }}>Enter readings below</div>
              </div>

              {submitted ? (
                <div className="alert alert-success">
                  ✓ Reading saved {!isOnline ? '(offline)' : ''}
                </div>
              ) : null}

              <div className="form-group">
                <label className="form-label">Amperage (AMP) *</label>
                <input
                  className="form-input"
                  type="number"
                  inputMode="decimal"
                  value={formData.amperage}
                  onChange={(e) => setFormData({ ...formData, amperage: e.target.value })}
                  placeholder="0.0"
                />
              </div>

              <div className="form-group">
                <label className="form-label">MW (Real Power) *</label>
                <input
                  className="form-input"
                  type="number"
                  inputMode="decimal"
                  value={formData.mw}
                  onChange={(e) => setFormData({ ...formData, mw: e.target.value })}
                  placeholder="0.0"
                />
              </div>

              <div className="form-group">
                <label className="form-label">MVAR (Reactive)</label>
                <input
                  className="form-input"
                  type="number"
                  inputMode="decimal"
                  value={formData.mvar}
                  onChange={(e) => setFormData({ ...formData, mvar: e.target.value })}
                  placeholder="0.0"
                />
              </div>

              <div className="form-group">
                <label className="form-label">Voltage (KV)</label>
                <input
                  className="form-input"
                  type="number"
                  inputMode="decimal"
                  value={formData.voltage}
                  onChange={(e) => setFormData({ ...formData, voltage: e.target.value })}
                  placeholder="0.0"
                />
              </div>

              <button className="btn btn-success" onClick={handleSubmit}>
                ✓ Save Reading
              </button>
            </>
          )}
        </div>
      );
    }

    /* ===== ALERTS SCREEN ===== */
    function AlertsScreen() {
      const [alerts, setAlerts] = useState([
        { id: 1, equipment: '2SHR TR2', type: 'SLA', message: 'SLA below 95%', severity: 'critical', timestamp: '5 min ago' },
        { id: 2, equipment: 'CONDC-A2', type: 'Maintenance', message: 'Overdue maintenance', severity: 'warning', timestamp: '2 hours ago' }
      ]);

      const handleAck = (id) => {
        setAlerts(alerts.filter(a => a.id !== id));
      };

      return (
        <div className="content">
          {alerts.length === 0 ? (
            <div style={{ textAlign: 'center', padding: '40px 20px', color: '#999' }}>
              <div style={{ fontSize: '16px', fontWeight: 600, marginBottom: '8px' }}>All Clear</div>
              <div style={{ fontSize: '12px' }}>No active alerts</div>
            </div>
          ) : (
            alerts.map(alert => (
              <div key={alert.id} className={`alert ${alert.severity === 'critical' ? 'alert-error' : 'alert-warning'}`}>
                <div style={{ fontWeight: 600, marginBottom: '4px' }}>
                  {alert.equipment} — {alert.type}
                </div>
                <div style={{ fontSize: '11px', marginBottom: '8px' }}>{alert.message}</div>
                <button
                  className="btn btn-sm"
                  onClick={() => handleAck(alert.id)}
                  style={{ padding: '6px 10px', fontSize: '11px', marginBottom: '0' }}
                >
                  Acknowledge
                </button>
              </div>
            ))
          )}
        </div>
      );
    }

    /* ===== MAIN APP ===== */
    function App() {
      const [activeTab, setActiveTab] = useState('status');
      const { isOnline, getSyncStatus } = useOfflineStorage();
      const { pendingCount } = getSyncStatus();

      const tabs = [
        { id: 'status', label: 'Status', icon: '📊' },
        { id: 'readings', label: 'Readings', icon: '📝' },
        { id: 'alerts', label: 'Alerts', icon: '🔔' },
        { id: 'more', label: 'More', icon: '⋯' }
      ];

      return (
        <div className="app">
          {!isOnline && <div className="offline-banner">📡 Offline Mode — Changes will sync when online</div>}
          
          <div className="sync-indicator" style={{ opacity: pendingCount > 0 ? 1 : 0 }}>
            {pendingCount > 0 && (
              <span className={pendingCount > 0 ? 'pending' : 'synced'}>
                ↺ {pendingCount} pending
              </span>
            )}
          </div>

          <div className="header">
            <div className="header-title">NISO Mobile</div>
            <span className={`header-status ${isOnline ? '' : 'offline'}`}>
              {isOnline ? 'Online' : 'Offline'}
            </span>
          </div>

          {activeTab === 'status' && <SLAStatusScreen />}
          {activeTab === 'readings' && <ReadingsEntryScreen />}
          {activeTab === 'alerts' && <AlertsScreen />}
          {activeTab === 'more' && (
            <div className="content">
              <div className="card">
                <div className="card-title">Additional Features</div>
                <div style={{ fontSize: '12px', color: '#999', marginTop: '8px' }}>
                  History, notifications, and settings coming soon.
                </div>
              </div>
            </div>
          )}

          <div className="tab-bar">
            {tabs.map(tab => (
              <button
                key={tab.id}
                className={`tab-btn ${activeTab === tab.id ? 'active' : ''}`}
                onClick={() => setActiveTab(tab.id)}
              >
                <div className="tab-icon">{tab.icon}</div>
                <div>{tab.label}</div>
              </button>
            ))}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
