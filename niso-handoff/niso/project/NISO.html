<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NISO</title><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><style>:root{--p:#2563eb;--s:#16a34a;--w:#d97706;--e:#dc2626;--n50:#f9fafb;--n100:#f3f4f6;--n200:#e5e7eb;--n600:#4b5563;--n700:#374151;--n900:#111827;--b:#e5e7eb}*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:system-ui,sans-serif;background:var(--n50);color:var(--n900);line-height:1.5}#root{display:flex;height:100vh}.sidebar{width:260px;background:white;border-right:1px solid var(--b);overflow-y:auto;display:flex;flex-direction:column}.sidebar-header{padding:1.5rem 1rem;border-bottom:1px solid var(--b);font-weight:700;font-size:.875rem;text-transform:uppercase;color:var(--n600)}.sidebar-content{flex:1;overflow-y:auto}.sidebar-footer{padding:1rem;border-top:1px solid var(--b);font-size:.875rem;color:var(--n600)}.nav-section{padding:.5rem 0}.nav-section-title{padding:.5rem 1rem;font-size:.75rem;font-weight:600;text-transform:uppercase;color:#6b7280;cursor:pointer;display:flex;justify-content:space-between;user-select:none}.nav-items{display:flex;flex-direction:column}.nav-item{padding:.625rem 1rem;font-size:.875rem;color:var(--n600);cursor:pointer;display:flex;gap:.5rem}.nav-item:hover{background:var(--n100);color:var(--n900)}.nav-item.active{background:#eff6ff;color:var(--p);font-weight:500;border-left:3px solid var(--p);padding-left:calc(1rem - 3px)}.main{flex:1;display:flex;flex-direction:column;overflow:hidden}.top{height:60px;background:white;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center;padding:0 2rem;box-shadow:0 1px 3px rgba(0,0,0,.05)}.content{flex:1;overflow-y:auto;padding:2rem;background:var(--n50)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.5rem;margin-bottom:2rem}.card{background:white;border:1px solid var(--b);border-radius:.5rem;padding:1.5rem}.card-title{font-size:.875rem;font-weight:600;color:var(--n600);text-transform:uppercase}.card-value{font-size:2rem;font-weight:700;margin:.5rem 0}.card-meta{font-size:.75rem;color:#6b7280}.table-wrapper{background:white;border:1px solid var(--b);border-radius:.5rem;overflow:hidden;margin-bottom:2rem}.table{width:100%;border-collapse:collapse;font-size:.875rem}.table th{padding:1rem;text-align:left;font-weight:600;color:var(--n600);text-transform:uppercase;font-size:.75rem;background:var(--n50);border-bottom:1px solid var(--b)}.table td{padding:1rem;border-bottom:1px solid var(--b)}.table tbody tr:hover{background:var(--n50)}.table tbody tr:last-child td{border-bottom:none}.badge{display:inline-block;padding:.25rem .75rem;border-radius:999px;font-size:.75rem;font-weight:600;text-transform:uppercase}.badge-ok{background:#dcfce7;color:#15803d}.badge-warn{background:#fef3c7;color:#92400e}.badge-err{background:#fee2e2;color:#7f1d1d}.button{padding:.625rem 1rem;border:none;border-radius:.375rem;font-size:.875rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:.5rem;transition:all 150ms}.button-primary{background:var(--p);color:white}.button-primary:hover{background:#1d4ed8}.button-secondary{background:var(--n100);color:var(--n900);border:1px solid var(--b)}.button-secondary:hover{background:var(--n200)}.button-sm{padding:.375rem .75rem;font-size:.75rem}.drawer-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:999;opacity:0;pointer-events:none;transition:opacity 200ms}.drawer-overlay.open{opacity:1;pointer-events:auto}.drawer{position:fixed;right:0;top:0;bottom:0;width:420px;background:white;box-shadow:-2px 0 10px rgba(0,0,0,.1);display:flex;flex-direction:column;z-index:1000;transform:translateX(100%);transition:transform 200ms}.drawer.open{transform:translateX(0)}.drawer-header{padding:1.5rem;border-bottom:1px solid var(--b)}.drawer-header h3{font-size:1.125rem;font-weight:600;margin-bottom:.25rem}.drawer-close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--n600)}.drawer-content{flex:1;overflow-y:auto;padding:1.5rem}.drawer-footer{padding:1.5rem;border-top:1px solid var(--b);display:flex;gap:1rem;justify-content:flex-end}.form-group{margin-bottom:1.5rem}.form-label{display:block;font-size:.875rem;font-weight:600;margin-bottom:.5rem}.form-input,.form-select,.form-textarea{width:100%;padding:.75rem;border:1px solid var(--b);border-radius:.375rem;font-size:.875rem;font-family:inherit;transition:border 150ms}.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(37,99,235,.1)}.mono{font-family:monospace;font-weight:600;font-size:1rem}.prev-val{padding:1rem;background:var(--n100);border-radius:.375rem;margin:1.5rem 0;border-left:3px solid #d1d5db}.prev-val-label{font-size:.75rem;color:#6b7280;text-transform:uppercase;font-weight:600;margin-bottom:.5rem}.prev-val-content{display:grid;grid-template-columns:1fr 1fr;gap:1rem;font-size:.875rem}.prev-val-item{display:flex;flex-direction:column}.prev-val-item-label{font-size:.75rem;color:var(--n600);margin-bottom:.25rem}.prev-val-item-value{font-weight:600;font-family:monospace}h2{font-size:1.5rem;margin-bottom:1.5rem}.flex-between{display:flex;justify-content:space-between;align-items:center}.mono-text{font-family:monospace;font-weight:600}</style></head><body><div id="root"></div><script type="text/babel">const {useState} = React;const ROLE_NAV = {operator:[{title:'Dashboard',items:['Current Shift','Active Interruptions']},{title:'Operations',items:['Hourly Readings','SLA Inputs','Inspections','Interruptions']},{title:'Knowledge',items:['Knowledge Center','AI Assistant']},{title:'Reports',items:['My Reports','Exports']}],station_admin:[{title:'Dashboard',items:['Station Overview','Active Interruptions']},{title:'Operations',items:['Hourly Readings','SLA Inputs','Inspections','Interruptions']},{title:'Management',items:['Operators','Devices','Templates']},{title:'Reports',items:['Station Reports','SLA Reports']},{title:'System',items:['Audit Logs']}],supervisor:[{title:'Dashboard',items:['Operational Overview','Active Interruptions']},{title:'Operations',items:['Hourly Readings','SLA Inputs','Inspections','Interruptions']},{title:'Review',items:['Corrections Queue','Pending Reviews']},{title:'Reports',items:['Station Reports','SLA Reports']}]};const EQUIP = [{id:'KNJ1',name:'2JEB-KNJ1',type:'330kV'},{id:'KNJ2',name:'2JEB-KNJ2',type:'330kV'},{id:'KNJ3',name:'KNJ-FDR1',type:'132kV'}];const INTERRUPTS = [{id:'INT-001',equip:'2JEB-KNJ1',cause:'Relay Fault',trip:'14:30',restore:'16:45',status:'Restored'},{id:'INT-002',equip:'KNJ-FDR1',cause:'CB Fault',trip:'18:15',restore:null,status:'Active'}];function Sidebar({role,collapsed,onToggle,onNav,active}){const nav = ROLE_NAV[role];return (<div className="sidebar"><div className="sidebar-header">◆ NISO</div><div className="sidebar-content">{nav.map((sec,i)=>(<div key={i} className={`nav-section ${collapsed[sec.title]?'collapsed':''}`}><div className="nav-section-title" onClick={()=>onToggle(sec.title)}><span>{sec.title}</span><span style={{fontSize:'.75rem'}}>{collapsed[sec.title]?'▼':'▲'}</span></div><div className="nav-items">{sec.items.map(item=>(<div key={item} className={`nav-item ${active===item?'active':''}`} onClick={()=>onNav(item)}><span>→</span> {item}</div>))}</div></div>))}</div><div className="sidebar-footer"><strong>Operator</strong><div style={{fontSize:'.75rem',color:'#6b7280',marginTop:'.25rem'}}>Kainji Station</div></div></div>);}function TopBar({title,role,onRoleChange}){return (<div className="top"><div style={{fontSize:'1.25rem',fontWeight:'600'}}>{title}</div><div style={{display:'flex',alignItems:'center',gap:'1rem',fontSize:'.875rem'}}><select value={role} onChange={e=>onRoleChange(e.target.value)} style={{padding:'.5rem',border:'1px solid var(--b)',borderRadius:'.375rem',fontSize:'.875rem',cursor:'pointer'}}><option value="operator">Operator</option><option value="station_admin">Station Admin</option><option value="supervisor">Supervisor</option></select><div style={{width:'40px',height:'40px',borderRadius:'50%',background:'#eff6ff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:'600',color:'var(--p)'}}>OP</div></div></div>);}function Dashboard(){return (<div><h2>Current Shift</h2><div className="cards"><div className="card"><div className="card-title">Active Equipment</div><div className="card-value">12</div><div className="card-meta">Readings this hour</div></div><div className="card"><div className="card-title">Interruptions</div><div className="card-value">1</div><div className="card-meta" style={{color:'var(--e)'}}>Active alert</div></div><div className="card"><div className="card-title">SLA Status</div><div style={{marginTop:'.5rem'}}><span className="badge badge-ok">On Track</span></div><div className="card-meta" style={{marginTop:'.5rem'}}>No violations</div></div><div className="card"><div className="card-title">Shift Time</div><div className="card-value" style={{fontSize:'1.5rem'}}>06:45</div><div className="card-meta">Elapsed today</div></div></div></div>);}function ReadingsModule({onOpen}){return (<div><div className="flex-between" style={{marginBottom:'1.5rem'}}><h2>Hourly Readings</h2><button className="button button-primary">📅 Today</button></div><div className="table-wrapper"><table className="table"><thead><tr><th>Equipment</th><th>Type</th><th>AMP</th><th>MW</th><th>KV</th><th>Status</th><th></th></tr></thead><tbody>{EQUIP.map(eq=>(<tr key={eq.id}><td style={{fontWeight:'600'}}>{eq.name}</td><td>{eq.type}</td><td className="mono-text">250</td><td className="mono-text">125</td><td className="mono-text">330</td><td><span className="badge badge-ok">ON</span></td><td><button className="button button-secondary button-sm" onClick={()=>onOpen('reading',eq)}>Edit</button></td></tr>))}</tbody></table></div></div>);}function SLAModule({onOpen}){return (<div><h2>SLA Inputs</h2><div className="table-wrapper"><table className="table"><thead><tr><th>Date</th><th>Hour</th><th>Forecast</th><th>Actual</th><th>Diff</th><th></th></tr></thead><tbody>{[{hour:'16:00',forecast:100,actual:98,diff:-2},{hour:'17:00',forecast:105,actual:108,diff:3},{hour:'18:00',forecast:110,actual:null,diff:null}].map((e,i)=>(<tr key={i}><td>2026-05-08</td><td className="mono-text">{e.hour}</td><td className="mono-text">{e.forecast} MW</td><td className="mono-text">{e.actual?e.actual+' MW':'—'}</td><td className="mono-text" style={{color:e.diff>2?'var(--w)':'var(--s)'}}>{e.diff?e.diff>0?'+'+e.diff:e.diff:'—'}</td><td><button className="button button-secondary button-sm" onClick={()=>onOpen('sla',e)}>Edit</button></td></tr>))}</tbody></table></div></div>);}function InterruptionsModule({onOpen}){return (<div><div className="flex-between" style={{marginBottom:'1.5rem'}}><h2>Interruptions</h2><button className="button button-primary" onClick={()=>onOpen('interruption',{})}>+ New</button></div><div className="table-wrapper"><table className="table"><thead><tr><th>Equipment</th><th>Cause</th><th>Trip</th><th>Restoration</th><th>Status</th></tr></thead><tbody>{INTERRUPTS.map(i=>(<tr key={i.id}><td style={{fontWeight:'600'}}>{i.equip}</td><td>{i.cause}</td><td className="mono-text">{i.trip}</td><td className="mono-text">{i.restore||'—'}</td><td><span className={`badge ${i.status==='Active'?'badge-err':'badge-ok'}`}>{i.status}</span></td></tr>))}</tbody></table></div></div>);}function InspectionsModule({onOpen}){return (<div><div className="flex-between" style={{marginBottom:'1.5rem'}}><h2>Inspections</h2><button className="button button-primary" onClick={()=>onOpen('inspection',{})}>+ New</button></div><div className="table-wrapper"><table className="table"><thead><tr><th>Date</th><th>Equipment</th><th>Type</th><th>Inspector</th><th>Status</th></tr></thead><tbody>{[{date:'2026-05-07',equip:'2JEB-KNJ1',type:'Routine',inspector:'Ahmed S.',status:'Completed'},{date:'2026-05-06',equip:'KNJ-FDR1',type:'Maintenance',inspector:'Zainab M.',status:'Completed'}].map((r,i)=>(<tr key={i}><td className="mono-text">{r.date}</td><td style={{fontWeight:'600'}}>{r.equip}</td><td>{r.type}</td><td>{r.inspector}</td><td><span className="badge badge-ok">{r.status}</span></td></tr>))}</tbody></table></div></div>);}function ReportsModule(){return (<div><h2>Reports</h2><div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(200px, 1fr))',gap:'1rem'}}>{[{name:'Daily Readings',desc:'Hourly readings summary'},{name:'SLA Report',desc:'SLA compliance & variance'},{name:'Interruption Log',desc:'All interruptions'},{name:'Monthly Summary',desc:'Full operational summary'}].map(r=>(<div key={r.name} className="card" style={{cursor:'pointer'}}><div className="card-title">{r.name}</div><p style={{fontSize:'.875rem',color:'var(--n600)',margin:'1rem 0'}}>{r.desc}</p><button className="button button-secondary button-sm">Generate</button></div>))}</div></div>);}function KnowledgeModule(){return (<div><h2>Knowledge Center</h2><div className="table-wrapper"><table className="table"><thead><tr><th>Document</th><th>Category</th><th>Updated</th><th></th></tr></thead><tbody>{[{name:'Relay Trip Procedures',cat:'Procedures',date:'2026-04-15'},{name:'SCADA Integration',cat:'Manuals',date:'2026-03-20'},{name:'Safety Protocols 2026',cat:'Safety',date:'2026-05-01'}].map((d,i)=>(<tr key={i}><td style={{fontWeight:'600'}}>{d.name}</td><td>{d.cat}</td><td className="mono-text">{d.date}</td><td><button className="button button-secondary button-sm">View</button></td></tr>))}</tbody></table></div></div>);}function ReadingDrawer({eq,onClose,onSave}){const [vals,setVals] = useState({amp:'',mw:'',mvar:'',kv:'',status:'ON'});return (<div className="drawer-overlay open" onClick={onClose}><div className="drawer open" onClick={e=>e.stopPropagation()}><div className="drawer-header"><div><h3>{eq.name}</h3><p style={{fontSize:'.875rem',color:'var(--n600)'}}>{eq.type} Feeder</p></div><button className="drawer-close" onClick={onClose}>×</button></div><div className="drawer-content">{[{id:'amp',label:'AMP',unit:'A'},{id:'mw',label:'MW',unit:'MW'},{id:'mvar',label:'MVAR',unit:'MVAR'},{id:'kv',label:'KV',unit:'kV'}].map(f=>(<div key={f.id} className="form-group"><label className="form-label">{f.label} ({f.unit})</label><input className="form-input mono" type="number" value={vals[f.id]} onChange={e=>setVals({...vals,[f.id]:e.target.value})} placeholder="Enter value" autoFocus={f.id==='amp'} /></div>))}<div className="prev-val"><div className="prev-val-label">Previous Hour</div><div className="prev-val-content"><div className="prev-val-item"><div className="prev-val-item-label">AMP</div><div className="prev-val-item-value">220</div></div><div className="prev-val-item"><div className="prev-val-item-label">MW</div><div className="prev-val-item-value">118</div></div></div></div></div><div className="drawer-footer"><button className="button button-secondary" onClick={onClose}>Back</button><button className="button button-primary" onClick={()=>{onSave();onClose();}}>Save & Next</button></div></div></div>);}function SLADrawer({data,onClose,onSave}){const [vals,setVals] = useState({forecast:110,meter:'',actual:'',remarks:''});return (<div className="drawer-overlay open" onClick={onClose}><div className="drawer open" onClick={e=>e.stopPropagation()}><div className="drawer-header"><div><h3>SLA Entry</h3><p style={{fontSize:'.875rem',color:'var(--n600)'}}>{data.hour||'Current Hour'}</p></div><button className="drawer-close" onClick={onClose}>×</button></div><div className="drawer-content"><div className="form-group"><label className="form-label">Forecast (MW)</label><input className="form-input mono" type="number" value={vals.forecast} disabled /></div><div className="form-group"><label className="form-label">Meter Reading (MWh)</label><input className="form-input mono" type="number" value={vals.meter} onChange={e=>setVals({...vals,meter:e.target.value})} placeholder="Enter reading" autoFocus /></div><div className="form-group"><label className="form-label">Actual MW</label><input className="form-input mono" type="number" value={vals.actual} onChange={e=>setVals({...vals,actual:e.target.value})} placeholder="Enter actual" /></div><div className="form-group"><label className="form-label">Remarks</label><textarea className="form-textarea" rows="3" value={vals.remarks} onChange={e=>setVals({...vals,remarks:e.target.value})} placeholder="Notes..." /></div></div><div className="drawer-footer"><button className="button button-secondary" onClick={onClose}>Cancel</button><button className="button button-primary" onClick={()=>{onSave();onClose();}}>Save</button></div></div></div>);}function InterruptionDrawer({onClose,onSave}){const [vals,setVals] = useState({equip:'',cause:'',trip:'',restore:'',notes:''});return (<div className="drawer-overlay open" onClick={onClose}><div className="drawer open" onClick={e=>e.stopPropagation()}><div className="drawer-header"><div><h3>New Interruption</h3><p style={{fontSize:'.875rem',color:'var(--n600)'}}>Record fault event</p></div><button className="drawer-close" onClick={onClose}>×</button></div><div className="drawer-content"><div className="form-group"><label className="form-label">Equipment</label><select className="form-select" value={vals.equip} onChange={e=>setVals({...vals,equip:e.target.value})} autoFocus><option value="">Select...</option>{EQUIP.map(e=>(<option key={e.id} value={e.id}>{e.name}</option>))}</select></div><div className="form-group"><label className="form-label">Cause</label><select className="form-select" value={vals.cause} onChange={e=>setVals({...vals,cause:e.target.value})}><option value="">Select...</option><option value="Relay Fault">Relay Fault</option><option value="CB Fault">CB Fault</option><option value="Manual Trip">Manual Trip</option></select></div><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1rem'}}><div className="form-group"><label className="form-label">Trip Time</label><input className="form-input" type="datetime-local" value={vals.trip} onChange={e=>setVals({...vals,trip:e.target.value})} /></div><div className="form-group"><label className="form-label">Restoration</label><input className="form-input" type="datetime-local" value={vals.restore} onChange={e=>setVals({...vals,restore:e.target.value})} /></div></div><div className="form-group"><label className="form-label">Notes</label><textarea className="form-textarea" rows="3" value={vals.notes} onChange={e=>setVals({...vals,notes:e.target.value})} placeholder="Details..." /></div></div><div className="drawer-footer"><button className="button button-secondary" onClick={onClose}>Cancel</button><button className="button button-primary" onClick={()=>{onSave();onClose();}}>Save</button></div></div></div>);}function InspectionDrawer({onClose,onSave}){const [vals,setVals] = useState({equip:'',type:'',inspector:'',findings:''});return (<div className="drawer-overlay open" onClick={onClose}><div className="drawer open" onClick={e=>e.stopPropagation()}><div className="drawer-header"><div><h3>New Inspection</h3><p style={{fontSize:'.875rem',color:'var(--n600)'}}>Equipment inspection</p></div><button className="drawer-close" onClick={onClose}>×</button></div><div className="drawer-content"><div className="form-group"><label className="form-label">Equipment</label><select className="form-select" value={vals.equip} onChange={e=>setVals({...vals,equip:e.target.value})} autoFocus><option value="">Select...</option>{EQUIP.map(e=>(<option key={e.id} value={e.id}>{e.name}</option>))}</select></div><div className="form-group"><label className="form-label">Type</label><select className="form-select" value={vals.type} onChange={e=>setVals({...vals,type:e.target.value})}><option value="">Select...</option><option value="Routine">Routine</option><option value="Maintenance">Maintenance</option><option value="Post-Fault">Post-Fault</option></select></div><div className="form-group"><label className="form-label">Inspector</label><input className="form-input" type="text" value={vals.inspector} onChange={e=>setVals({...vals,inspector:e.target.value})} placeholder="Your name" /></div><div className="form-group"><label className="form-label">Findings</label><textarea className="form-textarea" rows="4" value={vals.findings} onChange={e=>setVals({...vals,findings:e.target.value})} placeholder="Findings..." /></div></div><div className="drawer-footer"><button className="button button-secondary" onClick={onClose}>Cancel</button><button className="button button-primary" onClick={()=>{onSave();onClose();}}>Save</button></div></div></div>);}function App(){const [role,setRole] = useState('operator');const [active,setActive] = useState('Current Shift');const [collapsed,setCollapsed] = useState({});const [drawer,setDrawer] = useState(null);const [drawerData,setDrawerData] = useState(null);const handleOpen = (type,data)=>{setDrawer(type);setDrawerData(data);};const handleClose = ()=>setDrawer(null);let title='Dashboard',content = <Dashboard />;if(active==='Hourly Readings'){title='Hourly Readings';content = <ReadingsModule onOpen={handleOpen} />;}else if(active==='SLA Inputs'){title='SLA Inputs';content = <SLAModule onOpen={handleOpen} />;}else if(active==='Interruptions'){title='Interruptions';content = <InterruptionsModule onOpen={handleOpen} />;}else if(active==='Inspections'){title='Inspections';content = <InspectionsModule onOpen={handleOpen} />;}else if(active.includes('Reports')){title='Reports';content = <ReportsModule />;}else if(active.includes('Knowledge')){title='Knowledge Center';content = <KnowledgeModule />;}const sidebar = <Sidebar role={role} collapsed={collapsed} onToggle={(s)=>setCollapsed({...collapsed,[s]:!collapsed[s]})} onNav={setActive} active={active} />;const main = <div className="main"><TopBar title={title} role={role} onRoleChange={setRole} /><div className="content">{content}</div></div>;const readingDrawer = drawer==='reading' ? <ReadingDrawer eq={drawerData} onClose={handleClose} onSave={()=>console.log('saved')} /> : null;const slaDrawer = drawer==='sla' ? <SLADrawer data={drawerData} onClose={handleClose} onSave={()=>console.log('saved')} /> : null;const interruptDrawer = drawer==='interruption' ? <InterruptionDrawer onClose={handleClose} onSave={()=>console.log('saved')} /> : null;const inspectDrawer = drawer==='inspection' ? <InspectionDrawer onClose={handleClose} onSave={()=>console.log('saved')} /> : null;return (<>{sidebar}{main}{readingDrawer}{slaDrawer}{interruptDrawer}{inspectDrawer}</>);}ReactDOM.createRoot(document.getElementById('root')).render(<App />);</script></body></html>
