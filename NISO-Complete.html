<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NISO Complete</title><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><style>:root{--p:#2563eb;--s:#16a34a;--w:#d97706;--e:#dc2626;--n50:#f9fafb;--n100:#f3f4f6;--n200:#e5e7eb;--n600:#4b5563;--n700:#374151;--n900:#111827;--b:#e5e7eb}*{margin:0;padding:0;box-sizing:border-box}html,body{font-family:system-ui,sans-serif;background:var(--n50);color:var(--n900);line-height:1.5}#root{display:flex;height:100vh}.sidebar{width:260px;background:white;border-right:1px solid var(--b);overflow-y:auto;display:flex;flex-direction:column}.sidebar-header{padding:1.5rem 1rem;border-bottom:1px solid var(--b);font-weight:700;font-size:.875rem;text-transform:uppercase;color:var(--n600)}.sidebar-content{flex:1;overflow-y:auto}.sidebar-footer{padding:1rem;border-top:1px solid var(--b);font-size:.875rem;color:var(--n600)}.nav-section{padding:.5rem 0}.nav-section-title{padding:.5rem 1rem;font-size:.75rem;font-weight:600;text-transform:uppercase;color:#6b7280;cursor:pointer;display:flex;justify-content:space-between;user-select:none}.nav-items{display:flex;flex-direction:column}.nav-item{padding:.625rem 1rem;font-size:.875rem;color:var(--n600);cursor:pointer;display:flex;gap:.5rem}.nav-item:hover{background:var(--n100);color:var(--n900)}.nav-item.active{background:#eff6ff;color:var(--p);font-weight:500;border-left:3px solid var(--p);padding-left:calc(1rem - 3px)}.main{flex:1;display:flex;flex-direction:column;overflow:hidden}.top{height:60px;background:white;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center;padding:0 2rem;box-shadow:0 1px 3px rgba(0,0,0,.05)}.content{flex:1;overflow-y:auto;padding:2rem;background:var(--n50)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.5rem;margin-bottom:2rem}.card{background:white;border:1px solid var(--b);border-radius:.5rem;padding:1.5rem}.card-title{font-size:.875rem;font-weight:600;color:var(--n600);text-transform:uppercase}.card-value{font-size:2rem;font-weight:700;margin:.5rem 0}.card-meta{font-size:.75rem;color:#6b7280}.table-wrapper{background:white;border:1px solid var(--b);border-radius:.5rem;overflow:hidden;margin-bottom:2rem}.table{width:100%;border-collapse:collapse;font-size:.875rem}.table th{padding:1rem;text-align:left;font-weight:600;color:var(--n600);text-transform:uppercase;font-size:.75rem;background:var(--n50);border-bottom:1px solid var(--b)}.table td{padding:1rem;border-bottom:1px solid var(--b)}.table tbody tr:hover{background:var(--n50)}.table tbody tr:last-child td{border-bottom:none}.badge{display:inline-block;padding:.25rem .75rem;border-radius:999px;font-size:.75rem;font-weight:600;text-transform:uppercase}.badge-ok{background:#dcfce7;color:#15803d}.badge-warn{background:#fef3c7;color:#92400e}.badge-err{background:#fee2e2;color:#7f1d1d}.button{padding:.625rem 1rem;border:none;border-radius:.375rem;font-size:.875rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:.5rem;transition:all 150ms}.button-primary{background:var(--p);color:white}.button-primary:hover{background:#1d4ed8}.button-secondary{background:var(--n100);color:var(--n900);border:1px solid var(--b)}.button-secondary:hover{background:var(--n200)}.button-sm{padding:.375rem .75rem;font-size:.75rem}.form-group{margin-bottom:1.5rem}.form-label{display:block;font-size:.875rem;font-weight:600;margin-bottom:.5rem}.form-input,.form-select,.form-textarea{width:100%;padding:.75rem;border:1px solid var(--b);border-radius:.375rem;font-size:.875rem;font-family:inherit}.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(37,99,235,.1)}.mono-text{font-family:monospace;font-weight:600}h2{font-size:1.5rem;margin-bottom:1.5rem}h3{font-size:1rem;margin-bottom:1rem}</style></head><body><div id="root"></div><script type="text/babel">const {useState} = React;const ROLE_NAV={operator:[{title:'Dashboard',items:['Current Shift','Active Interruptions']},{title:'Operations',items:['Hourly Readings','SLA Inputs','Inspections','Interruptions','Event Logbook']},{title:'Messages',items:['Inbox','Station Messages']},{title:'Knowledge',items:['Knowledge Center','AI Assistant']},{title:'Reports',items:['My Reports','Exports']}],station_admin:[{title:'Dashboard',items:['Station Overview','Active Interruptions']},{title:'Operations',items:['Hourly Readings','SLA Inputs','Inspections','Interruptions','Event Logbook','Planned Operations']},{title:'Management',items:['Operators','Devices','Templates']},{title:'Reports',items:['Station Reports','SLA Reports','Monthly Reports','Sharing & Exports']},{title:'System',items:['Audit Logs','System Settings']}],supervisor:[{title:'Dashboard',items:['Operational Overview','Active Interruptions']},{title:'Operations',items:['Hourly Readings','SLA Inputs','Inspections','Interruptions','Event Logbook']},{title:'Review',items:['Corrections Queue','Pending Reviews']},{title:'Reports',items:['Station Reports','SLA Reports']}],regional_admin:[{title:'Dashboard',items:['Regional Overview','Active Interruptions']},{title:'Operations',items:['Hourly Readings','SLA Inputs','Inspections','Interruptions','Event Logbook','Planned Operations']},{title:'Management',items:['Stations','Devices','Templates']},{title:'Reports',items:['Regional Reports','SLA Reports','Sharing & Exports']},{title:'System',items:['Audit Logs','System Settings']}],headquarters_admin:[{title:'Dashboard',items:['National Overview','Regional Status']},{title:'Operations',items:['All Interruptions','Event Logbook']},{title:'Administration',items:['Regions','Stations','Users','Devices','Templates']},{title:'Reports',items:['National Reports','Regional Analysis','SLA Compliance']},{title:'Knowledge',items:['Knowledge Admin']},{title:'System',items:['Audit Logs','System Settings','Backup & Recovery']}],viewer:[{title:'Dashboard',items:['Shared Dashboard']},{title:'Reports',items:['Shared Reports','Shared Data']},{title:'Knowledge',items:['Knowledge Center']}],knowledge_admin:[{title:'Dashboard',items:['Knowledge Analytics']},{title:'Management',items:['Documents','Categories','Versions']},{title:'AI',items:['Knowledge Index','AI Sources']},{title:'Reports',items:['Usage Analytics']}]};const EQUIP=[{id:'KNJ1',name:'2JEB-KNJ1',type:'330kV'},{id:'KNJ2',name:'2JEB-KNJ2',type:'330kV'},{id:'KNJ3',name:'KNJ-FDR1',type:'132kV'}];const INTERRUPTS=[{id:'INT-001',equip:'2JEB-KNJ1',cause:'Relay Fault',trip:'14:30',restore:'16:45',status:'Restored'},{id:'INT-002',equip:'KNJ-FDR1',cause:'CB Fault',trip:'18:15',restore:null,status:'Active'}];function Sidebar({role,collapsed,onToggle,onNav,active}){const nav=ROLE_NAV[role];return (<div className="sidebar"><div className="sidebar-header">◆ NISO</div><div className="sidebar-content">{nav.map((sec,i)=>(<div key={i} className={`nav-section ${collapsed[sec.title]?'collapsed':''}`}><div className="nav-section-title" onClick={()=>onToggle(sec.title)}><span>{sec.title}</span><span style={{fontSize:'.75rem'}}>{collapsed[sec.title]?'▼':'▲'}</span></div><div className="nav-items">{sec.items.map(item=>(<div key={item} className={`nav-item ${active===item?'active':''}`} onClick={()=>onNav(item)}><span>→</span> {item}</div>))}</div></div>))}</div><div className="sidebar-footer"><strong>Role: {role.replace(/_/g,' ')}</strong><div style={{fontSize:'.75rem',color:'#6b7280',marginTop:'.25rem'}}>Kainji Station</div></div></div>);}function TopBar({title,role,onRoleChange}){return (<div className="top"><div style={{fontSize:'1.25rem',fontWeight:'600'}}>{title}</div><div style={{display:'flex',alignItems:'center',gap:'1rem',fontSize:'.875rem'}}><select value={role} onChange={e=>onRoleChange(e.target.value)} style={{padding:'.5rem',border:'1px solid var(--b)',borderRadius:'.375rem',fontSize:'.875rem',cursor:'pointer'}}><option value="operator">Operator</option><option value="station_admin">Station Admin</option><option value="supervisor">Supervisor</option><option value="regional_admin">Regional Admin</option><option value="headquarters_admin">Headquarters Admin</option><option value="viewer">Viewer</option><option value="knowledge_admin">Knowledge Admin</option></select><div style={{width:'40px',height:'40px',borderRadius:'50%',background:'#eff6ff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:'600',color:'var(--p)'}}>OP</div></div></div>);}function Dashboard(){return (<div><h2>Current Shift</h2><div className="cards"><div className="card"><div className="card-title">Active Equipment</div><div className="card-value">12</div><div className="card-meta">Readings this hour</div></div><div className="card"><div className="card-title">Interruptions</div><div className="card-value">1</div><div className="card-meta" style={{color:'var(--e)'}}>Active alert</div></div><div className="card"><div className="card-title">SLA Status</div><div style={{marginTop:'.5rem'}}><span className="badge badge-ok">On Track</span></div><div className="card-meta" style={{marginTop:'.5rem'}}>No violations</div></div><div className="card"><div className="card-title">Shift Time</div><div className="card-value" style={{fontSize:'1.5rem'}}>06:45</div><div className="card-meta">Elapsed today</div></div></div></div>);}function ReadingsModule({onOpen}){return (<div><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.5rem'}}><h2>Hourly Readings</h2><button className="button button-primary">📅 Today</button></div><div className="table-wrapper"><table className="table"><thead><tr><th>Equipment</th><th>Type</th><th>AMP</th><th>MW</th><th>KV</th><th>Status</th><th></th></tr></thead><tbody>{EQUIP.map(eq=>(<tr key={eq.id}><td style={{fontWeight:'600'}}>{eq.name}</td><td>{eq.type}</td><td className="mono-text">250</td><td className="mono-text">125</td><td className="mono-text">330</td><td><span className="badge badge-ok">ON</span></td><td><button className="button button-secondary button-sm" onClick={()=>onOpen('reading',eq)}>Edit</button></td></tr>))}</tbody></table></div></div>);}function SLAModule({onOpen}){return (<div><h2>SLA Inputs</h2><div className="table-wrapper"><table className="table"><thead><tr><th>Date</th><th>Hour</th><th>Forecast</th><th>Actual</th><th>Diff</th><th></th></tr></thead><tbody>{[{hour:'16:00',forecast:100,actual:98,diff:-2},{hour:'17:00',forecast:105,actual:108,diff:3},{hour:'18:00',forecast:110,actual:null,diff:null}].map((e,i)=>(<tr key={i}><td>2026-05-08</td><td className="mono-text">{e.hour}</td><td className="mono-text">{e.forecast} MW</td><td className="mono-text">{e.actual?e.actual+' MW':'—'}</td><td className="mono-text" style={{color:e.diff>2?'var(--w)':'var(--s)'}}>{e.diff?e.diff>0?'+'+e.diff:e.diff:'—'}</td><td><button className="button button-secondary button-sm" onClick={()=>onOpen('sla',e)}>Edit</button></td></tr>))}</tbody></table></div></div>);}function InterruptionsModule({onOpen}){return (<div><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.5rem'}}><h2>Interruptions</h2><button className="button button-primary" onClick={()=>onOpen('interruption',{})}>+ New</button></div><div className="table-wrapper"><table className="table"><thead><tr><th>Equipment</th><th>Cause</th><th>Trip</th><th>Restoration</th><th>Status</th></tr></thead><tbody>{INTERRUPTS.map(i=>(<tr key={i.id}><td style={{fontWeight:'60 `}>{e.type}</span></td></tr>))}</tbody></table></div></div>);}function PlannedOpsModule(){return (<div><h2>Planned Operations</h2><div className="table-wrapper"><table className="table"><thead><tr><th>Date</th><th>Equipment</th><th>Type</th><th>Duration</th><th>Reason</th><th>Status</th></tr></thead><tbody>{[{date:'2026-05-10',equip:'2JEB-KNJ1',type:'Maintenance',duration:'4h',reason:'Relay calibration',status:'Scheduled'},{date:'2026-05-12',equip:'KNJ-FDR1',type:'Inspection',duration:'2h',reason:'Annual inspection',status:'Approved'},{date:'2026-05-15',equip:'2JEB-KNJ2',type:'Replacement',duration:'8h',reason:'Breaker replacement',status:'Pending'}].map((o,i)=>(<tr key={i}><td className="mono-text">{o.date}</td><td style={{fontWeight:'600'}}>{o.equip}</td><td>{o.type}</td><td>{o.duration}</td><td>{o.reason}</td><td><span className={`badge ${o.status==='Approved'?'badge-ok':'badge-warn'}`}>{o.status}</span></td></tr>))}</tbody></table></div></div>);}function RegionalOverview(){return (<div><h2>Regional Overview</h2><div className="cards"><div className="card"><div className="card-title">Total Stations</div><div className="card-value">8</div><div className="card-meta">In region</div></div><div className="card"><div className="card-title">Active Equipment</div><div className="card-value">124</div><div className="card-meta">All stations</div></div><div className="card"><div className="card-title">Regional SLA</div><div style={{marginTop:'.5rem'}}><span className="badge badge-ok">Compliant</span></div><div className="card-meta" style={{marginTop:'.5rem'}}>98%</div></div><div className="card"><div className="card-title">Interruptions</div><div className="card-value">3</div><div className="card-meta">Active</div></div></div><h3 style={{marginTop:'2rem'}}>Stations</h3><div className="table-wrapper"><table className="table"><thead><tr><th>Station</th><th>Equipment</th><th>Status</th><th>SLA</th><th>Interruptions</th></tr></thead><tbody>{[{station:'Kainji',equip:12,status:'Operational',sla:'On Track',int:1},{station:'Akangba',equip:8,status:'Operational',sla:'On Track',int:0},{station:'Jebba',equip:10,status:'Maintenance',sla:'Review',int:2}].map((s,i)=>(<tr key={i}><td style={{fontWeight:'600'}}>{s.station}</td><td className="mono-text">{s.equip}</td><td><span className={`badge ${s.status==='Operational'?'badge-ok':'badge-warn'}`}>{s.status}</span></td><td><span className={`badge ${s.sla==='On Track'?'badge-ok':'badge-warn'}`}>{s.sla}</span></td><td className="mono-text">{s.int}</td></tr>))}</tbody></table></div></div>);}function HeadquartersOverview(){return (<div><h2>National Operations</h2><div className="cards"><div className="card"><div className="card-title">Total Regions</div><div className="card-value">4</div><div className="card-meta">Across Nigeria</div></div><div className="card"><div className="card-title">Total Stations</div><div className="card-value">32</div><div className="card-meta">All regions</div></div><div className="card"><div className="card-title">National SLA</div><div style={{marginTop:'.5rem'}}><span className="badge badge-ok">Excellent</span></div><div className="card-meta" style={{marginTop:'.5rem'}}>99.2%</div></div><div className="card"><div className="card-title">Critical Alerts</div><div className="card-value">2</div><div className="card-meta" style={{color:'var(--e)'}}>Require action</div></div></div><h3 style={{marginTop:'2rem'}}>Regional Summary</h3><div className="table-wrapper"><table className="table"><thead><tr><th>Region</th><th>Stations</th><th>Equipment</th><th>SLA</th><th>Interruptions</th></tr></thead><tbody>{[{region:'North',stations:8,equip:96,sla:'On Track',int:2},{region:'South',stations:9,equip:108,sla:'On Track',int:1},{region:'East',stations:8,equip:96,sla:'Review',int:3},{region:'West',stations:7,equip:84,sla:'On Track',int:0}].map((r,i)=>(<tr key={i}><td style={{fontWeight:'600'}}>{r.region}</td><td className="mono-text">{r.stations}</td><td className="mono-text">{r.equip}</td><td><span className={`badge ${r.sla==='On Track'?'badge-ok':'badge-warn'}`}>{r.sla}</span></td><td className="mono-text">{r.int}</td></tr>))}</tbody></table></div></div>);}function ViewerDashboard(){return (<div><h2>Shared Data</h2><div className="cards"><div className="card"><div className="card-title">Reports Accessible</div><div className="card-value">5</div><div className="card-meta">Shared with you</div></div><div className="card"><div className="card-title">Last Updated</div><div className="card-value" style={{fontSize:'1rem'}}>16:30</div><div className="card-meta">Kainji SLA</div></div></div><h3 style={{marginTop:'2rem'}}>Shared Reports</h3><div className="table-wrapper"><table className="table"><thead><tr><th>Report</th><th>Shared By</th><th>Range</th><th>Expires</th></tr></thead><tbody>{[{report:'Kainji SLA May',by:'Regional Admin',range:'May 1-31',expires:'Jun 8'},{report:'Akangba Readings',by:'Station Admin',range:'May 1-31',expires:'May 15'},{report:'Regional Log',by:'Regional Admin',range:'Apr-May',expires:'None'}].map((r,i)=>(<tr key={i}><td style={{fontWeight:'600'}}>{r.report}</td><td>{r.by}</td><td className="mono-text">{r.range}</td><td className="mono-text">{r.expires}</td></tr>))}</tbody></table></div></div>);}function KnowledgeAdminModule(){return (<div><h2>Knowledge Management</h2><div style={{marginBottom:'1.5rem'}}><button className="button button-primary">+ Upload</button></div><div className="table-wrapper"><table className="table"><thead><tr><th>Document</th><th>Category</th><th>By</th><th>Version</th><th>Status</th></tr></thead><tbody>{[{doc:'Relay Procedures',cat:'Procedures',by:'Admin KN',ver:'v3',status:'Published'},{doc:'SCADA Guide',cat:'Manuals',by:'Admin Tech',ver:'v2',status:'Published'},{doc:'Safety 2026',cat:'Safety',by:'Admin Safety',ver:'v1',status:'Draft'}].map((d,i)=>(<tr key={i}><td style={{fontWeight:'600'}}>{d.doc}</td><td>{d.cat}</td><td>{d.by}</td><td className="mono-text">{d.ver}</td><td><span className={`badge ${d.status==='Published'?'badge-ok':'badge-warn'}`}>{d.status}</span></td></tr>))}</tbody></table></div></div>);}function AuditLogsModule(){return (<div><h2>Audit Logs</h2><div className="table-wrapper"><table className="table"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Resource</th><th>Details</th></tr></thead><tbody>{[{time:'2026-05-08 18:15',user:'Op. John',action:'CREATE',res:'Reading',det:'2JEB-KNJ1'},{time:'2026-05-08 17:45',user:'Sup. Ahmed',action:'UPDATE',res:'SLA',det:'Approved'},{time:'2026-05-08 16:30',user:'Admin Reg',action:'EXPORT',res:'Report',det:'Regional SLA'},{time:'2026-05-07 22:00',user:'System',action:'SEAL',res:'Month',det:'April sealed'}].map((l,i)=>(<tr key={i}><td className="mono-text" style={{fontSize:'.75rem'}}>{l.time}</td><td>{l.user}</td><td><span className={`badge ${l.action==='CREATE'?'badge-ok':'badge-err'}`}>{l.action}</span></td><td>{l.res}</td><td style={{fontSize:'.875rem'}}>{l.det}</td></tr>))}</tbody></table></div></div>);}function SystemSettingsModule(){return (<div><h2>System Settings</h2><div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(300px, 1fr))',gap:'1.5rem'}}><div className="card"><h3 style={{fontSize:'1rem',marginBottom:'1rem'}}>General</h3><div className="form-group"><label className="form-label">System Name</label><input className="form-input" type="text" value="NISO - Nigeria ISM" readOnly /></div><div className="form-group"><label className="form-label">Timezone</label><select className="form-select"><option>UTC+1</option></select></div></div><div className="card"><h3 style={{fontSize:'1rem',marginBottom:'1rem'}}>Notifications</h3><label style={{display:'flex',alignItems:'center',gap:'.5rem',cursor:'pointer',marginBottom:'1rem'}}><input type="checkbox" defaultChecked /> Email</label><label style={{display:'flex',alignItems:'center',gap:'.5rem',cursor:'pointer',marginBottom:'1rem'}}><input type="checkbox" defaultChecked /> SMS</label><label style={{display:'flex',alignItems:'center',gap:'.5rem',cursor:'pointer'}}><input type="checkbox" /> WhatsApp</label></div><div className="card"><h3 style={{fontSize:'1rem',marginBottom:'1rem'}}>Month Sealing</h3><div className="form-group"><label className="form-label">Current</label><input className="form-input" type="text" value="May 2026 (Open)" readOnly /></div><div style={{display:'flex',gap:'.5rem'}}><button className="button button-secondary">Review</button><button className="button button-primary">Seal</button></div></div></div></div>);}function SharingModule(){return (<div><h2>Sharing & Exports</h2><div className="table-wrapper"><table className="table"><thead><tr><th>Data</th><th>Shared With</th><th>Scope</th><th>Expires</th></tr></thead><tbody>{[{item:'Kainji SLA',with:'External Analyst',scope:'May 2026',exp:'2026-06-08'},{item:'Akangba Readings',with:'Maintenance',scope:'30 days',exp:'None'},{item:'Regional Log',with:'Auditor',scope:'Full year',exp:'2026-12-31'}].map((s,i)=>(<tr key={i}><td style={{fontWeight:'600'}}>{s.item}</td><td>{s.with}</td><td style={{fontSize:'.875rem'}}>{s.scope}</td><td className="mono-text">{s.exp}</td></tr>))}</tbody></table></div></div>);}function ReportsModule(){return (<div><h2>Reports</h2><div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(200px, 1fr))',gap:'1rem'}}>{[{name:'Daily Readings',desc:'Hourly data'},{name:'SLA Report',desc:'Compliance'},{name:'Interruptions',desc:'Fault log'},{name:'Monthly',desc:'Summary'}].map(r=>(<div key={r.name} className="card" style={{cursor:'pointer'}}><div className="card-title">{r.name}</div><p style={{fontSize:'.875rem',color:'var(--n600)',margin:'1rem 0'}}>{r.desc}</p><button className="button button-secondary button-sm">Generate</button></div>))}</div></div>);}function KnowledgeModule(){return (<div><h2>Knowledge Center</h2><div className="table-wrapper"><table className="table"><thead><tr><th>Document</th><th>Category</th><th>Updated</th></tr></thead><tbody>{[{name:'Relay Procedures',cat:'Procedures',date:' 'kv',label:'KV',unit:'kV'}].map(f=>(<div key={f.id} className="form-group"><label className="form-label">{f.label} ({f.unit})</label><input className="form-input" type="number" value={vals[f.id]} onChange={e=>setVals({...vals,[f.id]:e.target.value})} placeholder="Enter" /></div>))}</div><div style={{padding:'1.5rem',borderTop:'1px solid var(--b)',display:'flex',gap:'1rem',justifyContent:'flex-end'}}><button className="button button-secondary" onClick={onClose}>Back</button><button className="button button-primary" onClick={()=>{onSave();onClose();}}>Save & Next</button></div></div></div>);}function App(){const [role,setRole]=useState('operator');const [active,setActive]=useState('Current Shift');const [collapsed,setCollapsed]=useState({});const [drawer,setDrawer]=useState(null);const [drawerData,setDrawerData]=useState(null);const handleOpen=(type,data)=>{setDrawer(type);setDrawerData(data);};const handleClose=()=>setDrawer(null);let title='Dashboard',content=<Dashboard />;if(active==='Hourly Readings'){title='Hourly Readings';content=<ReadingsModule onOpen={handleOpen} />;}else if(active==='SLA Inputs'){title='SLA Inputs';content=<SLAModule onOpen={handleOpen} />;}else if(active==='Interruptions'){title='Interruptions';content=<InterruptionsModule onOpen={handleOpen} />;}else if(active==='Inspections'){title='Inspections';content=<InspectionsModule onOpen={handleOpen} />;}else if(active==='Event Logbook'){title='Event Logbook';content=<EventLogbook />;}else if(active==='Planned Operations'){title='Planned Operations';content=<PlannedOpsModule />;}else if(active==='Regional Overview'){title='Regional Overview';content=<RegionalOverview />;}else if(active==='National Overview'){title='National Overview';content=<HeadquartersOverview />;}else if(active==='Shared Dashboard'){title='Shared Data';content=<ViewerDashboard />;}else if(active==='Knowledge Admin'){title='Knowledge Admin';content=<KnowledgeAdminModule />;}else if(active==='Audit Logs'){title='Audit Logs';content=<AuditLogsModule />;}else if(active==='System Settings'){title='System Settings';content=<SystemSettingsModule />;}else if(active.includes('Sharing')||active.includes('Export')){title='Sharing & Exports';content=<SharingModule />;}else if(active.includes('Report')){title='Reports';content=<ReportsModule />;}else if(active.includes('Knowledge')){title='Knowledge Center';content=<KnowledgeModule />;}else if(active.includes('Message')||active.includes('Inbox')){title='Messages';content=<MessagesModule />;};return (<><Sidebar role={role} collapsed={collapsed} onToggle={(s)=>setCollapsed({...collapsed,[s]:!collapsed[s]})} onNav={setActive} active={active} /><div className="main"><TopBar title={title} role={role} onRoleChange={setRole} /><div className="content">{content}</div></div>{drawer==='reading'&&<ReadingDrawer eq={drawerData} onClose={handleClose} onSave={()=>console.log('saved')} />}</>);}ReactDOM.createRoot(document.getElementById('root')).render(<App />);</script></body></html>
