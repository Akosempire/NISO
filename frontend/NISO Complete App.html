<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NISO — Operational Platform</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
    
    /* ===== LOGIN PAGE ===== */
    .login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    }
    
    .login-container { width: 100%; max-width: 420px; padding: 20px; }
    
    .login-card {
      background: white;
      border-radius: 8px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    
    .logo { font-size: 32px; font-weight: 700; color: #2563eb; margin-bottom: 8px; }
    .subtitle { font-size: 13px; color: #666; margin-bottom: 32px; }
    
    .scope-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
    .scope-tab {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      color: #666;
    }
    .scope-tab.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }
    
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: #333; }
    .form-input, .form-select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
    }
    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
    }
    
    .login-btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .login-btn:hover { background: #1d4ed8; }
    .login-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    
    .alert {
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 16px;
      font-size: 12px;
    }
    .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    
    .demo-info {
      margin-top: 20px;
      padding: 12px;
      background: #f0f9ff;
      border: 1px solid #bfdbfe;
      border-radius: 4px;
      font-size: 11px;
      color: #1e40af;
    }
    
    /* ===== DASHBOARD PAGE ===== */
    .app {
      display: flex;
      min-height: 100vh;
    }
    
    .sidebar {
      width: 260px;
      background: #f9f9f9;
      border-right: 1px solid #e0e0e0;
      padding: 24px 0;
      overflow-y: auto;
    }
    
    .sidebar-logo {
      padding: 0 20px 24px;
      font-size: 18px;
      font-weight: 700;
      color: #2563eb;
      border-bottom: 1px solid #e0e0e0;
      margin-bottom: 20px;
    }
    
    .user-context {
      padding: 12px 16px;
      background: #f0f0f0;
      margin: 0 12px 16px;
      border-radius: 4px;
      font-size: 11px;
    }
    
    .context-label { font-weight: 600; color: #666; }
    .context-value { color: #2563eb; font-weight: 600; margin-top: 4px; }
    
    .nav-section { padding: 0 12px; margin-bottom: 16px; }
    .nav-section-title { padding: 0 8px 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #999; }
    .nav-item {
      padding: 10px 12px;
      border-radius: 3px;
      font-size: 13px;
      cursor: pointer;
      color: #666;
      transition: all 0.2s;
    }
    .nav-item.active { background: #e3f2fd; color: #2563eb; font-weight: 600; }
    .nav-item:hover { background: #f0f0f0; }
    
    .logout-btn {
      width: calc(100% - 24px);
      margin: 0 12px;
      padding: 8px 12px;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
      border-radius: 3px;
      font-size: 12px;
      cursor: pointer;
    }
    
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .header {
      background: white;
      border-bottom: 1px solid #e0e0e0;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .header-title { font-size: 18px; font-weight: 600; }
    .header-right { display: flex; gap: 16px; align-items: center; }
    .user-info { text-align: right; font-size: 12px; }
    .user-name { font-weight: 600; }
    
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    
    .card {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .card-title { font-size: 14px; font-weight: 600; margin-bottom: 16px; }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    
    .stat-card {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 20px;
    }
    
    .stat-label { font-size: 11px; color: #999; }
    .stat-value { font-size: 28px; font-weight: 700; color: #2563eb; margin-top: 8px; }
    
    table { width: 100%; border-collapse: collapse; }
    th { padding: 12px; text-align: left; font-size: 11px; font-weight: 600; background: #f9f9f9; border-bottom: 1px solid #e0e0e0; }
    td { padding: 12px; border-bottom: 1px solid #f0f0f0; font-size: 12px; }
    tr:hover { background: #f9f9f9; }
    
    .btn {
      padding: 8px 12px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 3px;
      font-size: 12px;
      cursor: pointer;
    }
    
    .btn-primary {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }
    
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
    }
    
    .badge-green { background: #e6f9f0; color: #047857; }
    .badge-red { background: #fee2e2; color: #991b1b; }
    .badge-blue { background: #dbeafe; color: #1e40af; }
    
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.3);
      z-index: 999;
    }
    
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 420px;
      height: 100vh;
      background: white;
      border-left: 1px solid #e0e0e0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s;
    }
    
    .drawer.open { transform: translateX(0); }
    
    .drawer-header { padding: 20px; border-bottom: 1px solid #e0e0e0; }
    .drawer-title { font-size: 16px; font-weight: 600; }
    .drawer-close { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 20px; cursor: pointer; }
    .drawer-content { flex: 1; overflow-y: auto; padding: 20px; }
    .drawer-footer { padding: 20px; border-top: 1px solid #e0e0e0; display: flex; gap: 8px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Initialize Supabase (replace with your keys)
    const { createClient } = window.supabase;
    const supabase = createClient(
      'https://YOUR_SUPABASE_URL.supabase.co',
      'YOUR_SUPABASE_ANON_KEY'
    );

    // ===== MOCK DATA =====
    const mockEquipment = [
      { id: 1, name: '2SHR TR1', status: 'operating' },
      { id: 2, name: '2SHR TR2', status: 'alert' },
      { id: 3, name: 'CONDC-A1', status: 'operating' }
    ];

    const mockReadings = [
      { id: 1, equipment_id: 1, equipment: { name: '2SHR TR1' }, amperage: 450.5, mw: 750.2, reading_time: new Date().toISOString() },
      { id: 2, equipment_id: 2, equipment: { name: '2SHR TR2' }, amperage: 380.1, mw: 620.5, reading_time: new Date().toISOString() }
    ];

    // ===== LOGIN PAGE =====
    function SignIn({ onSuccess }) {
      const [scope, setScope] = useState('station');
      const [email, setEmail] = useState('operator@akangba.niso');
      const [password, setPassword] = useState('password123');
      const [station, setStation] = useState('AKANGBA');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSignIn = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');

        try {
          // Simulate Supabase login
          // In real app: const { data, error } = await supabase.auth.signInWithPassword(...)
          
          const userData = {
            id: 'user-123',
            email,
            firstName: email.split('@')[0],
            lastName: 'User',
            role: scope === 'station' ? 'Operator' : 'HQ Admin',
            station,
            scope: {
              type: scope === 'station' ? 'station' : 'global',
              stationId: scope === 'station' ? 1 : null,
              canEdit: true,
              canApprove: scope !== 'station'
            }
          };

          // Store in localStorage
          localStorage.setItem('niso_session', JSON.stringify(userData));
          onSuccess(userData);
        } catch (err) {
          setError('Sign in failed. Try demo credentials.');
        }

        setLoading(false);
      };

      return (
        <div className="login-page">
          <div className="login-container">
            <div className="login-card">
              <div className="logo">NISO</div>
              <div className="subtitle">Operational Platform</div>

              {error && <div className="alert alert-error">{error}</div>}

              <div style={{ marginBottom: '24px' }}>
                <label style={{ fontSize: '11px', fontWeight: 600, textTransform: 'uppercase', color: '#999', marginBottom: '12px', display: 'block' }}>Sign in as</label>
                <div className="scope-tabs">
                  <button
                    className={`scope-tab ${scope === 'station' ? 'active' : ''}`}
                    onClick={() => setScope('station')}
                    disabled={loading}
                  >
                    Station User
                  </button>
                  <button
                    className={`scope-tab ${scope === 'admin' ? 'active' : ''}`}
                    onClick={() => setScope('admin')}
                    disabled={loading}
                  >
                    Admin
                  </button>
                </div>
              </div>

              <form onSubmit={handleSignIn}>
                {scope === 'station' && (
                  <div className="form-group">
                    <label className="form-label">Station</label>
                    <select className="form-select" value={station} onChange={(e) => setStation(e.target.value)} disabled={loading}>
                      <option>AKANGBA</option>
                      <option>OSOGBO</option>
                      <option>BENIN</option>
                      <option>AJAOKUTA</option>
                    </select>
                  </div>
                )}

                <div className="form-group">
                  <label className="form-label">Email</label>
                  <input className="form-input" type="email" value={email} onChange={(e) => setEmail(e.target.value)} disabled={loading} />
                </div>

                <div className="form-group">
                  <label className="form-label">Password</label>
                  <input className="form-input" type="password" value={password} onChange={(e) => setPassword(e.target.value)} disabled={loading} />
                </div>

                <button type="submit" className="login-btn" disabled={loading}>
                  {loading ? 'Signing in...' : 'Sign In'}
                </button>
              </form>

              <div className="demo-info">
                <strong>Demo Credentials:</strong>
                <div style={{ marginTop: '8px', fontFamily: 'monospace', fontSize: '11px' }}>
                  operator@akangba.niso / password123
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ===== DASHBOARD PAGE =====
    function Dashboard({ user, onLogout }) {
      const [currentPage, setCurrentPage] = useState('dashboard');
      const [showForm, setShowForm] = useState(false);
      const [readings, setReadings] = useState(mockReadings);
      const [equipment, setEquipment] = useState(mockEquipment);

      const pageTitle = {
        dashboard: '📊 Dashboard',
        readings: '📝 Readings',
        sla: '📈 SLA Tracking',
        interruptions: '⚡ Interruptions',
        inspections: '🔍 Inspections',
        reports: '📄 Reports'
      };

      return (
        <div className="app">
          <div className="sidebar">
            <div className="sidebar-logo">NISO</div>
            <div className="user-context">
              <div className="context-label">Role</div>
              <div className="context-value">{user.role}</div>
              {user.station && (
                <>
                  <div className="context-label" style={{ marginTop: '8px' }}>Station</div>
                  <div className="context-value">{user.station}</div>
                </>
              )}
            </div>

            <div className="nav-section">
              <div className="nav-section-title">Operations</div>
              <div className={`nav-item ${currentPage === 'dashboard' ? 'active' : ''}`} onClick={() => setCurrentPage('dashboard')}>📊 Dashboard</div>
              <div className={`nav-item ${currentPage === 'readings' ? 'active' : ''}`} onClick={() => setCurrentPage('readings')}>📝 Readings</div>
              <div className={`nav-item ${currentPage === 'sla' ? 'active' : ''}`} onClick={() => setCurrentPage('sla')}>📈 SLA</div>
              <div className={`nav-item ${currentPage === 'interruptions' ? 'active' : ''}`} onClick={() => setCurrentPage('interruptions')}>⚡ Interruptions</div>
              <div className={`nav-item ${currentPage === 'inspections' ? 'active' : ''}`} onClick={() => setCurrentPage('inspections')}>🔍 Inspections</div>
            </div>

            <div className="nav-section">
              <div className="nav-section-title">Records</div>
              <div className={`nav-item ${currentPage === 'reports' ? 'active' : ''}`} onClick={() => setCurrentPage('reports')}>📄 Reports</div>
            </div>

            <div style={{ position: 'absolute', bottom: 20, left: 12, right: 12 }}>
              <button className="logout-btn" onClick={onLogout}>Sign Out</button>
            </div>
          </div>

          <div className="main">
            <div className="header">
              <div className="header-title">{pageTitle[currentPage]}</div>
              <div className="header-right">
                <div className="user-info">
                  <div className="user-name">{user.firstName} {user.lastName}</div>
                  <div style={{ fontSize: '11px', color: '#999' }}>{user.email}</div>
                </div>
              </div>
            </div>

            <div className="content">
              {currentPage === 'dashboard' && (
                <div>
                  <div className="stats-grid">
                    <div className="stat-card">
                      <div className="stat-label">Equipment Active</div>
                      <div className="stat-value">{equipment.length}</div>
                    </div>
                    <div className="stat-card">
                      <div className="stat-label">Today's Readings</div>
                      <div className="stat-value">{readings.length}</div>
                    </div>
                    <div className="stat-card">
                      <div className="stat-label">Avg SLA</div>
                      <div className="stat-value">96.1%</div>
                    </div>
                  </div>

                  <div className="card">
                    <div className="card-title">Equipment Status</div>
                    <table>
                      <thead><tr><th>Equipment</th><th>Status</th></tr></thead>
                      <tbody>
                        {equipment.map(eq => (
                          <tr key={eq.id}>
                            <td style={{ fontWeight: 600 }}>{eq.name}</td>
                            <td><span className={`badge ${eq.status === 'operating' ? 'badge-green' : 'badge-red'}`}>{eq.status}</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {currentPage === 'readings' && (
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                    <h2>Readings</h2>
                    {user.scope.canEdit && <button className="btn btn-primary" onClick={() => setShowForm(true)}>+ New Reading</button>}
                  </div>

                  <div className="card">
                    <table>
                      <thead><tr><th>Equipment</th><th>AMP</th><th>MW</th><th>Time</th></tr></thead>
                      <tbody>
                        {readings.map(r => (
                          <tr key={r.id}>
                            <td>{r.equipment.name}</td>
                            <td>{r.amperage}</td>
                            <td>{r.mw}</td>
                            <td>{new Date(r.reading_time).toLocaleTimeString()}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  {showForm && (
                    <div className="drawer-overlay" onClick={() => setShowForm(false)}>
                      <div className="drawer open" onClick={e => e.stopPropagation()}>
                        <div className="drawer-header">
                          <button className="drawer-close" onClick={() => setShowForm(false)}>×</button>
                          <div className="drawer-title">New Reading</div>
                        </div>
                        <div className="drawer-content">
                          <div className="form-group">
                            <label className="form-label">Equipment</label>
                            <select className="form-select">
                              {equipment.map(eq => <option key={eq.id}>{eq.name}</option>)}
                            </select>
                          </div>
                          <div className="form-group">
                            <label className="form-label">Amperage (AMP)</label>
                            <input className="form-input" type="number" />
                          </div>
                          <div className="form-group">
                            <label className="form-label">MW</label>
                            <input className="form-input" type="number" />
                          </div>
                        </div>
                        <div className="drawer-footer">
                          <button className="btn" onClick={() => setShowForm(false)}>Cancel</button>
                          <button className="btn btn-primary">Save</button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {currentPage === 'sla' && <div className="card"><div className="card-title">SLA Tracking</div><p>SLA data will appear here</p></div>}
              {currentPage === 'interruptions' && <div className="card"><div className="card-title">Interruptions</div><p>Interruption logs will appear here</p></div>}
              {currentPage === 'inspections' && <div className="card"><div className="card-title">Inspections</div><p>Inspection records will appear here</p></div>}
              {currentPage === 'reports' && <div className="card"><div className="card-title">Reports</div><p>Reports will appear here</p></div>}
            </div>
          </div>
        </div>
      );
    }

    // ===== MAIN APP =====
    function App() {
      const [user, setUser] = useState(null);

      useEffect(() => {
        // Check if user is already logged in
        const session = localStorage.getItem('niso_session');
        if (session) {
          setUser(JSON.parse(session));
        }
      }, []);

      const handleLogout = () => {
        localStorage.removeItem('niso_session');
        setUser(null);
      };

      return (
        <div>
          {!user ? (
            <SignIn onSuccess={setUser} />
          ) : (
            <Dashboard user={user} onLogout={handleLogout} />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
