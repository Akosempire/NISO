<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NISO — Operational Platform</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
    
    .login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    }
    
    .login-container { width: 100%; max-width: 420px; padding: 20px; }
    .login-card {
      background: white;
      border-radius: 8px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    
    .logo { font-size: 32px; font-weight: 700; color: #2563eb; margin-bottom: 8px; }
    .subtitle { font-size: 13px; color: #666; margin-bottom: 32px; }
    
    .scope-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
    .scope-tab {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      color: #666;
    }
    .scope-tab.active { background: #2563eb; color: white; border-color: #2563eb; }
    
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: #333; }
    .form-input, .form-select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
    }
    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
    }
    
    .login-btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .login-btn:hover { background: #1d4ed8; }
    .login-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    
    .alert {
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 16px;
      font-size: 12px;
    }
    .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .alert-success { background: #e6f9f0; color: #047857; border: 1px solid #6ee7b7; }
    
    /* Dashboard styles */
    .app {
      display: flex;
      min-height: 100vh;
    }
    
    .sidebar {
      width: 260px;
      background: #f9f9f9;
      border-right: 1px solid #e0e0e0;
      padding: 24px 0;
      overflow-y: auto;
    }
    
    .sidebar-logo {
      padding: 0 20px 24px;
      font-size: 18px;
      font-weight: 700;
      color: #2563eb;
      border-bottom: 1px solid #e0e0e0;
      margin-bottom: 20px;
    }
    
    .user-context {
      padding: 12px 16px;
      background: #f0f0f0;
      margin: 0 12px 16px;
      border-radius: 4px;
      font-size: 11px;
    }
    
    .context-label { font-weight: 600; color: #666; }
    .context-value { color: #2563eb; font-weight: 600; margin-top: 4px; }
    
    .nav-section { padding: 0 12px; margin-bottom: 16px; }
    .nav-section-title { padding: 0 8px 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #999; }
    .nav-item {
      padding: 10px 12px;
      border-radius: 3px;
      font-size: 13px;
      cursor: pointer;
      color: #666;
      transition: all 0.2s;
    }
    .nav-item.active { background: #e3f2fd; color: #2563eb; font-weight: 600; }
    .nav-item:hover { background: #f0f0f0; }
    
    .logout-btn {
      width: calc(100% - 24px);
      margin: 0 12px;
      padding: 8px 12px;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
      border-radius: 3px;
      font-size: 12px;
      cursor: pointer;
    }
    
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .header {
      background: white;
      border-bottom: 1px solid #e0e0e0;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .header-title { font-size: 18px; font-weight: 600; }
    .header-right { display: flex; gap: 16px; align-items: center; }
    .user-info { text-align: right; font-size: 12px; }
    .user-name { font-weight: 600; }
    
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    
    .card {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .card-title { font-size: 14px; font-weight: 600; margin-bottom: 16px; }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    
    .stat-card {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 20px;
    }
    
    .stat-label { font-size: 11px; color: #999; }
    .stat-value { font-size: 28px; font-weight: 700; color: #2563eb; margin-top: 8px; }
    
    table { width: 100%; border-collapse: collapse; }
    th { padding: 12px; text-align: left; font-size: 11px; font-weight: 600; background: #f9f9f9; border-bottom: 1px solid #e0e0e0; }
    td { padding: 12px; border-bottom: 1px solid #f0f0f0; font-size: 12px; }
    tr:hover { background: #f9f9f9; }
    
    .btn {
      padding: 8px 12px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 3px;
      font-size: 12px;
      cursor: pointer;
    }
    
    .btn-primary {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }
    
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
    }
    
    .badge-green { background: #e6f9f0; color: #047857; }
    .badge-red { background: #fee2e2; color: #991b1b; }
    .badge-blue { background: #dbeafe; color: #1e40af; }
    
    .loading { color: #999; padding: 20px; text-align: center; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Initialize Supabase
    // REPLACE THESE WITH YOUR ACTUAL CREDENTIALS
    const SUPABASE_URL = 'https://YOUR_SUPABASE_URL.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

    const { createClient } = window.supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ===== LOGIN PAGE =====
    function SignIn({ onSuccess }) {
      const [scope, setScope] = useState('station');
      const [email, setEmail] = useState('operator@akangba.niso');
      const [password, setPassword] = useState('password123');
      const [station, setStation] = useState('1');
      const [stations, setStations] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      useEffect(() => {
        loadStations();
      }, []);

      const loadStations = async () => {
        try {
          const { data, error } = await supabase
            .from('stations')
            .select('id, name, region')
            .order('name');

          if (error) throw error;
          setStations(data || []);
        } catch (err) {
          console.error('Failed to load stations:', err);
        }
      };

      const handleSignIn = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');

        try {
          // Sign in with Supabase Auth
          const { data, error: authError } = await supabase.auth.signInWithPassword({
            email,
            password
          });

          if (authError) throw new Error(authError.message);

          // Fetch user profile
          const { data: profile, error: profileError } = await supabase
            .from('users')
            .select('id, email, first_name, last_name, role, station_id, region')
            .eq('auth_id', data.user.id)
            .single();

          if (profileError) throw new Error('User profile not found');

          // Determine scope
          const stationScopedRoles = ['Operator', 'Supervisor', 'Station Admin'];
          const userScope = stationScopedRoles.includes(profile.role)
            ? {
                type: 'station',
                stationId: parseInt(station),
                canEdit: profile.role !== 'Operator',
                canApprove: profile.role === 'Supervisor' || profile.role === 'Station Admin'
              }
            : {
                type: 'global',
                canEdit: true,
                canApprove: true,
                canManageUsers: profile.role === 'HQ Admin'
              };

          const userData = {
            id: data.user.id,
            email: profile.email,
            firstName: profile.first_name,
            lastName: profile.last_name,
            role: profile.role,
            station: stations.find(s => s.id === parseInt(station))?.name || 'Global',
            scope: userScope
          };

          localStorage.setItem('niso_session', JSON.stringify(userData));
          onSuccess(userData);
        } catch (err) {
          setError(err.message || 'Sign in failed');
        }

        setLoading(false);
      };

      return (
        <div className="login-page">
          <div className="login-container">
            <div className="login-card">
              <div className="logo">NISO</div>
              <div className="subtitle">Operational Platform (Supabase Connected)</div>

              {error && <div className="alert alert-error">{error}</div>}

              <div style={{ marginBottom: '24px' }}>
                <label style={{ fontSize: '11px', fontWeight: 600, textTransform: 'uppercase', color: '#999', marginBottom: '12px', display: 'block' }}>Sign in as</label>
                <div className="scope-tabs">
                  <button className={`scope-tab ${scope === 'station' ? 'active' : ''}`} onClick={() => setScope('station')} disabled={loading}>Station User</button>
                  <button className={`scope-tab ${scope === 'admin' ? 'active' : ''}`} onClick={() => setScope('admin')} disabled={loading}>Admin</button>
                </div>
              </div>

              <form onSubmit={handleSignIn}>
                {scope === 'station' && (
                  <div className="form-group">
                    <label className="form-label">Station</label>
                    <select className="form-select" value={station} onChange={(e) => setStation(e.target.value)} disabled={loading}>
                      <option value="">Select your station</option>
                      {stations.map(s => (
                        <option key={s.id} value={s.id}>{s.name} ({s.region})</option>
                      ))}
                    </select>
                  </div>
                )}

                <div className="form-group">
                  <label className="form-label">Email</label>
                  <input className="form-input" type="email" value={email} onChange={(e) => setEmail(e.target.value)} disabled={loading} />
                </div>

                <div className="form-group">
                  <label className="form-label">Password</label>
                  <input className="form-input" type="password" value={password} onChange={(e) => setPassword(e.target.value)} disabled={loading} />
                </div>

                <button type="submit" className="login-btn" disabled={loading || (scope === 'station' && !station)}>
                  {loading ? 'Signing in...' : 'Sign In'}
                </button>
              </form>

              <div style={{ marginTop: '20px', padding: '12px', background: '#f0f9ff', border: '1px solid #bfdbfe', borderRadius: '4px', fontSize: '11px', color: '#1e40af' }}>
                <strong>Demo Accounts:</strong>
                <div style={{ marginTop: '8px', fontFamily: 'monospace', fontSize: '11px' }}>
                  operator@akangba.niso / password123
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ===== DASHBOARD PAGE =====
    function Dashboard({ user, onLogout }) {
      const [currentPage, setCurrentPage] = useState('dashboard');
      const [readings, setReadings] = useState([]);
      const [equipment, setEquipment] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        loadData();
      }, []);

      const loadData = async () => {
        try {
          setLoading(true);

          // Fetch equipment (RLS will filter by station/global)
          const { data: equipmentData, error: equipmentError } = await supabase
            .from('equipment')
            .select('*')
            .order('name');

          if (equipmentError) throw equipmentError;
          setEquipment(equipmentData || []);

          // Fetch readings
          const { data: readingsData, error: readingsError } = await supabase
            .from('readings')
            .select('*, equipment(name)')
            .order('reading_time', { ascending: false })
            .limit(20);

          if (readingsError) throw readingsError;
          setReadings(readingsData || []);
        } catch (err) {
          console.error('Failed to load data:', err);
        }

        setLoading(false);
      };

      return (
        <div className="app">
          <div className="sidebar">
            <div className="sidebar-logo">NISO</div>
            <div className="user-context">
              <div className="context-label">Role</div>
              <div className="context-value">{user.role}</div>
              <div className="context-label" style={{ marginTop: '8px' }}>Scope</div>
              <div className="context-value">{user.station}</div>
            </div>

            <div className="nav-section">
              <div className="nav-section-title">Operations</div>
              <div className={`nav-item ${currentPage === 'dashboard' ? 'active' : ''}`} onClick={() => setCurrentPage('dashboard')}>📊 Dashboard</div>
              <div className={`nav-item ${currentPage === 'readings' ? 'active' : ''}`} onClick={() => setCurrentPage('readings')}>📝 Readings</div>
              <div className={`nav-item ${currentPage === 'equipment' ? 'active' : ''}`} onClick={() => setCurrentPage('equipment')}>⚙️ Equipment</div>
            </div>

            <div style={{ position: 'absolute', bottom: 20, left: 12, right: 12 }}>
              <button className="logout-btn" onClick={onLogout}>Sign Out</button>
            </div>
          </div>

          <div className="main">
            <div className="header">
              <div className="header-title">
                {currentPage === 'dashboard' ? '📊 Dashboard' : currentPage === 'readings' ? '📝 Readings' : '⚙️ Equipment'}
              </div>
              <div className="header-right">
                <div className="user-info">
                  <div className="user-name">{user.firstName} {user.lastName}</div>
                  <div style={{ fontSize: '11px', color: '#999' }}>{user.email}</div>
                </div>
              </div>
            </div>

            <div className="content">
              {loading ? (
                <div className="loading">Loading data from Supabase...</div>
              ) : (
                <>
                  {currentPage === 'dashboard' && (
                    <div>
                      <div className="stats-grid">
                        <div className="stat-card">
                          <div className="stat-label">Equipment</div>
                          <div className="stat-value">{equipment.length}</div>
                        </div>
                        <div className="stat-card">
                          <div className="stat-label">Recent Readings</div>
                          <div className="stat-value">{readings.length}</div>
                        </div>
                        <div className="stat-card">
                          <div className="stat-label">Avg SLA</div>
                          <div className="stat-value">96.1%</div>
                        </div>
                      </div>

                      <div className="card">
                        <div className="card-title">Equipment Status</div>
                        {equipment.length > 0 ? (
                          <table>
                            <thead><tr><th>Equipment</th><th>Type</th><th>Status</th></tr></thead>
                            <tbody>
                              {equipment.map(eq => (
                                <tr key={eq.id}>
                                  <td style={{ fontWeight: 600 }}>{eq.name}</td>
                                  <td>{eq.type}</td>
                                  <td><span className={`badge badge-${eq.status === 'operating' ? 'green' : 'red'}`}>{eq.status}</span></td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        ) : (
                          <div style={{ color: '#999' }}>No equipment data available</div>
                        )}
                      </div>
                    </div>
                  )}

                  {currentPage === 'readings' && (
                    <div className="card">
                      <div className="card-title">Recent Readings</div>
                      {readings.length > 0 ? (
                        <table>
                          <thead><tr><th>Equipment</th><th>AMP</th><th>MW</th><th>Time</th></tr></thead>
                          <tbody>
                            {readings.map(r => (
                              <tr key={r.id}>
                                <td>{r.equipment?.name || 'Unknown'}</td>
                                <td>{r.amperage || '-'}</td>
                                <td>{r.mw || '-'}</td>
                                <td>{new Date(r.reading_time).toLocaleString()}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      ) : (
                        <div style={{ color: '#999' }}>No readings available</div>
                      )}
                    </div>
                  )}

                  {currentPage === 'equipment' && (
                    <div className="card">
                      <div className="card-title">Equipment List</div>
                      {equipment.length > 0 ? (
                        <table>
                          <thead><tr><th>Name</th><th>Type</th><th>Model</th><th>Status</th><th>SLA Target</th></tr></thead>
                          <tbody>
                            {equipment.map(eq => (
                              <tr key={eq.id}>
                                <td style={{ fontWeight: 600 }}>{eq.name}</td>
                                <td>{eq.type}</td>
                                <td>{eq.model || '-'}</td>
                                <td><span className={`badge badge-${eq.status === 'operating' ? 'green' : 'red'}`}>{eq.status}</span></td>
                                <td>{eq.sla_target}%</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      ) : (
                        <div style={{ color: '#999' }}>No equipment found</div>
                      )}
                    </div>
                  )}
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ===== MAIN APP =====
    function App() {
      const [user, setUser] = useState(null);

      useEffect(() => {
        const session = localStorage.getItem('niso_session');
        if (session) {
          setUser(JSON.parse(session));
        }
      }, []);

      const handleLogout = () => {
        localStorage.removeItem('niso_session');
        supabase.auth.signOut();
        setUser(null);
      };

      return (
        <div>
          {!user ? (
            <SignIn onSuccess={setUser} />
          ) : (
            <Dashboard user={user} onLogout={handleLogout} />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
