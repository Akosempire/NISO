<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NISO — Complete Operational Platform</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
    
    .app { display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background: #f9f9f9; border-right: 1px solid #e0e0e0; padding: 24px 0; overflow-y: auto; }
    .sidebar-logo { padding: 0 20px 24px; font-size: 18px; font-weight: 700; color: #2563eb; border-bottom: 1px solid #e0e0e0; margin-bottom: 20px; }
    .user-context { padding: 12px 16px; background: #f0f0f0; margin: 0 12px 16px; border-radius: 4px; font-size: 11px; }
    .context-label { font-weight: 600; color: #666; }
    .context-value { color: #2563eb; font-weight: 600; }
    .nav-section { padding: 0 12px; margin-bottom: 16px; }
    .nav-section-title { padding: 0 8px 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #999; }
    .nav-item { padding: 10px 12px; border-radius: 3px; font-size: 13px; cursor: pointer; color: #666; }
    .nav-item.active { background: #e3f2fd; color: #2563eb; font-weight: 600; }
    .nav-item:hover { background: #f0f0f0; }
    
    .header { background: white; border-bottom: 1px solid #e0e0e0; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .header-title { font-size: 18px; font-weight: 600; }
    .header-right { display: flex; gap: 16px; align-items: center; }
    .user-info { text-align: right; font-size: 12px; }
    .user-name { font-weight: 600; }
    
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .content { flex: 1; overflow-y: auto; padding: 24px; }
    
    .card { background: white; border: 1px solid #e0e0e0; border-radius: 4px; padding: 20px; margin-bottom: 20px; }
    .card-title { font-size: 14px; font-weight: 600; margin-bottom: 16px; }
    
    table { width: 100%; border-collapse: collapse; }
    th { padding: 12px; text-align: left; font-size: 11px; font-weight: 600; background: #f9f9f9; border-bottom: 1px solid #e0e0e0; }
    td { padding: 12px; border-bottom: 1px solid #f0f0f0; font-size: 12px; }
    tr:hover { background: #f9f9f9; }
    
    .btn { padding: 8px 12px; border: 1px solid #ddd; background: white; border-radius: 3px; font-size: 12px; cursor: pointer; }
    .btn-primary { background: #2563eb; color: white; border-color: #2563eb; }
    .btn-sm { padding: 6px 10px; font-size: 11px; }
    
    .badge { display: inline-block; padding: 4px 8px; border-radius: 3px; font-size: 10px; font-weight: 600; }
    .badge-green { background: #e6f9f0; color: #047857; }
    .badge-red { background: #fee2e2; color: #991b1b; }
    .badge-blue { background: #dbeafe; color: #1e40af; }
    
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    .form-input { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 3px; font-size: 13px; }
    
    .drawer-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); z-index: 999; }
    .drawer { position: fixed; top: 0; right: 0; width: 420px; height: 100vh; background: white; border-left: 1px solid #e0e0e0; z-index: 1000; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s; }
    .drawer.open { transform: translateX(0); }
    .drawer-header { padding: 20px; border-bottom: 1px solid #e0e0e0; }
    .drawer-title { font-size: 16px; font-weight: 600; }
    .drawer-close { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 20px; cursor: pointer; }
    .drawer-content { flex: 1; overflow-y: auto; padding: 20px; }
    .drawer-footer { padding: 20px; border-top: 1px solid #e0e0e0; display: flex; gap: 8px; }
    
    .alert { padding: 12px; border-radius: 3px; margin-bottom: 12px; font-size: 12px; }
    .alert-error { background: #fee2e2; color: #991b1b; }
    .alert-success { background: #e6f9f0; color: #047857; }
    .alert-info { background: #dbeafe; color: #1e40af; }
    
    .login-page { display: flex; align-items: center; justify-content: center; height: 100vh; background: #f5f5f5; }
    .login-card { background: white; padding: 40px; border-radius: 4px; width: 100%; max-width: 400px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .login-title { font-size: 24px; font-weight: 700; color: #2563eb; margin-bottom: 24px; text-align: center; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // API Client
    class NisoAPI {
      constructor(baseURL = 'http://localhost:3000/api') {
        this.baseURL = baseURL;
        this.token = localStorage.getItem('niso_token');
      }

      setToken(token) {
        this.token = token;
        localStorage.setItem('niso_token', token);
      }

      async request(method, endpoint, body = null) {
        const headers = { 'Content-Type': 'application/json' };
        if (this.token) headers['Authorization'] = `Bearer ${this.token}`;

        const response = await fetch(`${this.baseURL}${endpoint}`, {
          method, headers, body: body ? JSON.stringify(body) : null
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Request failed');
        }

        return await response.json();
      }

      async login(email, password) {
        const data = await this.request('POST', '/auth/login', { email, password });
        this.setToken(data.token);
        return data;
      }

      async getEquipment(filters = {}) {
        const params = new URLSearchParams(filters);
        return this.request('GET', `/equipment?${params}`);
      }

      async getReadings(filters = {}) {
        const params = new URLSearchParams(filters);
        return this.request('GET', `/readings?${params}`);
      }

      async createReading(data) {
        return this.request('POST', '/readings', data);
      }

      async getInterruptions(filters = {}) {
        const params = new URLSearchParams(filters);
        return this.request('GET', `/interruptions?${params}`);
      }

      async createInterruption(data) {
        return this.request('POST', '/interruptions', data);
      }

      async getSLA(filters = {}) {
        const params = new URLSearchParams(filters);
        return this.request('GET', `/sla?${params}`);
      }

      async getInspections(filters = {}) {
        const params = new URLSearchParams(filters);
        return this.request('GET', `/inspections?${params}`);
      }

      async createInspection(data) {
        return this.request('POST', '/inspections', data);
      }

      async getCurrentUser() {
        return this.request('GET', '/users/me');
      }
    }

    const api = new NisoAPI();

    // ===== LOGIN =====
    function LoginPage({ onLogin }) {
      const [email, setEmail] = useState('operator@niso.local');
      const [password, setPassword] = useState('password123');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const data = await api.login(email, password);
          onLogin(data.user);
        } catch (err) {
          setError(err.message);
        }
        setLoading(false);
      };

      return (
        <div className="login-page">
          <div className="login-card">
            <div className="login-title">NISO</div>
            {error && <div className="alert alert-error">{error}</div>}
            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <label className="form-label">Email</label>
                <input className="form-input" type="email" value={email} onChange={e => setEmail(e.target.value)} />
              </div>
              <div className="form-group">
                <label className="form-label">Password</label>
                <input className="form-input" type="password" value={password} onChange={e => setPassword(e.target.value)} />
              </div>
              <button type="submit" className="btn btn-primary" style={{ width: '100%' }} disabled={loading}>
                {loading ? 'Logging in...' : 'Login'}
              </button>
            </form>
            <div style={{ marginTop: '16px', fontSize: '12px', color: '#999' }}>
              Demo: operator@niso.local / password123
            </div>
          </div>
        </div>
      );
    }

    // ===== DASHBOARD =====
    function Dashboard() {
      const [equipment, setEquipment] = useState([]);
      const [readings, setReadings] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        loadData();
      }, []);

      const loadData = async () => {
        try {
          const [eq, rd] = await Promise.all([
            api.getEquipment({ stationId: 1 }),
            api.getReadings({ stationId: 1, limit: 10 })
          ]);
          setEquipment(eq);
          setReadings(rd);
        } catch (err) {
          console.error('Failed to load dashboard data:', err);
        }
        setLoading(false);
      };

      return (
        <div className="content">
          <h2 style={{ marginBottom: '20px' }}>Dashboard</h2>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '16px', marginBottom: '24px' }}>
            <div className="card">
              <div style={{ fontSize: '11px', color: '#999' }}>Equipment Count</div>
              <div style={{ fontSize: '28px', fontWeight: 700, color: '#2563eb', marginTop: '8px' }}>{equipment.length}</div>
            </div>
            <div className="card">
              <div style={{ fontSize: '11px', color: '#999' }}>Recent Readings</div>
              <div style={{ fontSize: '28px', fontWeight: 700, color: '#047857', marginTop: '8px' }}>{readings.length}</div>
            </div>
            <div className="card">
              <div style={{ fontSize: '11px', color: '#999' }}>System Status</div>
              <div style={{ fontSize: '28px', fontWeight: 700, color: '#2563eb', marginTop: '8px' }}>
                <span className="badge badge-green">Operational</span>
              </div>
            </div>
          </div>

          <div className="card">
            <div className="card-title">Equipment Status</div>
            {loading ? (
              <div style={{ color: '#999' }}>Loading...</div>
            ) : (
              <table>
                <thead><tr><th>Equipment</th><th>Status</th></tr></thead>
                <tbody>
                  {equipment.map(eq => (
                    <tr key={eq.id}>
                      <td style={{ fontWeight: 600 }}>{eq.name}</td>
                      <td><span className="badge badge-green">{eq.status || 'operating'}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        </div>
      );
    }

    // ===== READINGS PAGE =====
    function ReadingsPage() {
      const [readings, setReadings] = useState([]);
      const [showForm, setShowForm] = useState(false);
      const [equipment, setEquipment] = useState([]);
      const [loading, setLoading] = useState(true);
      const [newReading, setNewReading] = useState({ equipmentId: '', amperage: '', mw: '', mvar: '', kv: '' });

      useEffect(() => {
        loadData();
      }, []);

      const loadData = async () => {
        try {
          const [eq, rd] = await Promise.all([
            api.getEquipment({ stationId: 1 }),
            api.getReadings({ stationId: 1 })
          ]);
          setEquipment(eq);
          setReadings(rd);
        } catch (err) {
          console.error('Failed to load readings:', err);
        }
        setLoading(false);
      };

      const handleSubmit = async () => {
        try {
          await api.createReading({
            equipmentId: parseInt(newReading.equipmentId),
            stationId: 1,
            amperage: parseFloat(newReading.amperage),
            mw: parseFloat(newReading.mw),
            mvar: parseFloat(newReading.mvar),
            kv: parseFloat(newReading.kv)
          });
          setShowForm(false);
          await loadData();
        } catch (err) {
          console.error('Failed to create reading:', err);
        }
      };

      return (
        <div className="content">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
            <h2>Readings</h2>
            <button className="btn btn-primary" onClick={() => setShowForm(true)}>+ New Reading</button>
          </div>

          <div className="card">
            {loading ? (
              <div>Loading...</div>
            ) : (
              <table>
                <thead><tr><th>Equipment</th><th>AMP</th><th>MW</th><th>MVAR</th><th>KV</th><th>Time</th></tr></thead>
                <tbody>
                  {readings.map(r => (
                    <tr key={r.id}>
                      <td>{r.equipment_id}</td>
                      <td>{r.amperage}</td>
                      <td>{r.mw}</td>
                      <td>{r.mvar}</td>
                      <td>{r.kv}</td>
                      <td>{new Date(r.reading_time).toLocaleString()}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>

          {showForm && (
            <div className="drawer-overlay" onClick={() => setShowForm(false)}>
              <div className="drawer open" onClick={e => e.stopPropagation()}>
                <div className="drawer-header">
                  <button className="drawer-close" onClick={() => setShowForm(false)}>×</button>
                  <div className="drawer-title">New Reading</div>
                </div>
                <div className="drawer-content">
                  <div className="form-group">
                    <label className="form-label">Equipment *</label>
                    <select className="form-input" value={newReading.equipmentId} onChange={e => setNewReading({...newReading, equipmentId: e.target.value})}>
                      <option value="">Select equipment</option>
                      {equipment.map(eq => <option key={eq.id} value={eq.id}>{eq.name}</option>)}
                    </select>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Amperage (AMP) *</label>
                    <input className="form-input" type="number" step="0.1" value={newReading.amperage} onChange={e => setNewReading({...newReading, amperage: e.target.value})} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">MW *</label>
                    <input className="form-input" type="number" step="0.1" value={newReading.mw} onChange={e => setNewReading({...newReading, mw: e.target.value})} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">MVAR</label>
                    <input className="form-input" type="number" step="0.1" value={newReading.mvar} onChange={e => setNewReading({...newReading, mvar: e.target.value})} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">KV</label>
                    <input className="form-input" type="number" step="0.1" value={newReading.kv} onChange={e => setNewReading({...newReading, kv: e.target.value})} />
                  </div>
                </div>
                <div className="drawer-footer">
                  <button className="btn" onClick={() => setShowForm(false)}>Cancel</button>
                  <button className="btn btn-primary" onClick={handleSubmit}>Save</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ===== MAIN APP =====
    function App() {
      const [user, setUser] = useState(null);
      const [currentPage, setCurrentPage] = useState('dashboard');

      if (!user) {
        return <LoginPage onLogin={setUser} />;
      }

      return (
        <div className="app">
          <div className="sidebar">
            <div className="sidebar-logo">NISO</div>
            <div className="user-context">
              <div className="context-label">Role</div>
              <div className="context-value">{user.role}</div>
              <div className="context-label" style={{ marginTop: '8px' }}>Station</div>
              <div className="context-value">AKANGBA</div>
            </div>

            <div className="nav-section">
              <div className="nav-section-title">Operations</div>
              <div className={`nav-item ${currentPage === 'dashboard' ? 'active' : ''}`} onClick={() => setCurrentPage('dashboard')}>📊 Dashboard</div>
              <div className={`nav-item ${currentPage === 'readings' ? 'active' : ''}`} onClick={() => setCurrentPage('readings')}>📝 Readings</div>
            </div>

            <div style={{ position: 'absolute', bottom: 20, left: 20 }}>
              <button className="btn btn-sm" onClick={() => { localStorage.removeItem('niso_token'); setUser(null); }}>Logout</button>
            </div>
          </div>

          <div className="main">
            <div className="header">
              <div className="header-title">{currentPage === 'dashboard' ? '📊 Dashboard' : '📝 Readings'}</div>
              <div className="header-right">
                <div className="user-info">
                  <div className="user-name">{user.firstName} {user.lastName}</div>
                  <div style={{ fontSize: '11px', color: '#999' }}>{user.email}</div>
                </div>
              </div>
            </div>

            {currentPage === 'dashboard' && <Dashboard />}
            {currentPage === 'readings' && <ReadingsPage />}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
